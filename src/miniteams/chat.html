<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniteams chat</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1b1f24; --dim: #6b7380; --faint: #9aa1ab;
    --line: #e3e6ea; --accent: #4f5bd5; --accent-soft: #4f5bd51a; --hot: #e5484d; --ok: #2f9e6e; --typing: #b7791f;
    --mention: #0284c7; --mention-soft: #0ea5e91a; --on-mention: #fff;
    --shadow: 0 1px 2px #0000000d, 0 4px 14px #0000000a;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --text: #e6e8ec; --dim: #8b93a1; --faint: #5d6472;
    --line: #262b35; --accent: #8b96ff; --accent-soft: #8b96ff22; --hot: #ff6b6f; --ok: #4cc38a; --typing: #f0b45a;
    --mention: #7dd3fc; --mention-soft: #7dd3fc1f; --on-mention: #062a3d;
    --shadow: 0 1px 2px #00000066, 0 6px 20px #00000055;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --text: #e6e8ec; --dim: #8b93a1; --faint: #5d6472;
      --line: #262b35; --accent: #8b96ff; --accent-soft: #8b96ff22; --hot: #ff6b6f; --ok: #4cc38a; --typing: #f0b45a;
      --mention: #7dd3fc; --mention-soft: #7dd3fc1f; --on-mention: #062a3d;
      --shadow: 0 1px 2px #00000066, 0 6px 20px #00000055;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  header { background: color-mix(in srgb, var(--bg) 85%, transparent); padding: 10px 16px; display: flex; align-items: center;
    gap: 12px; border-bottom: 1px solid var(--line); flex: none; position: relative; z-index: 2; }
  #find, #day { font: inherit; font-size: 12.5px; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 2px 8px; }
  #find { width: 12em; }
  #hits { position: absolute; top: 100%; right: 16px; width: min(440px, 92vw); max-height: 60vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }
  #hits[hidden] { display: none; }
  #hits button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px;
    padding: 4px 8px; cursor: pointer; }
  #hits button:hover, #hits button:focus-visible { background: var(--panel-2); }
  #hits b { font-weight: 600; margin-right: 6px; }
  #hits .none { color: var(--dim); padding: 4px 8px; }
  #hits .none.err { color: var(--hot); }
  #back { color: var(--dim); text-decoration: none; font-size: 15px; border-radius: 8px; padding: 2px 6px; }
  #back:hover { background: var(--panel-2); color: var(--text); }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  #members { color: var(--faint); font-size: 12.5px; white-space: nowrap; margin-right: auto; }
  #status { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); flex: none; }
  #status.off { background: var(--hot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 25%, transparent); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 10px; cursor: pointer; color: var(--dim); font-size: 12.5px; white-space: nowrap; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }

  #pane { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  #list { flex: 1; overflow-y: auto; padding: 8px 12px; }
  #latest { position: absolute; right: 20px; bottom: 10px; box-shadow: var(--shadow); color: var(--accent); }
  #latest[hidden] { display: none; }
  #note { text-align: center; color: var(--dim); padding: 1em; }
  #note.err { color: var(--hot); }
  .msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 0 10px; padding: 4px 8px; border-radius: 10px; position: relative; }
  .msg:not(.cont) { margin-top: 10px; }
  .msg:hover { background: var(--panel); }
  .msg.hit { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 13px; color: #fff; }
  .msg.cont .av, .msg.cont .head { display: none; }
  .body { grid-column: 2; min-width: 0; }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .head b { font-weight: 600; }
  .msg.me .head b { color: var(--accent); }
  .when, .edited { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .html { overflow-wrap: anywhere; }
  .html p { margin: 0; }
  .html p + p, .html ul, .html ol, .html pre, .html table { margin: 4px 0; }
  .html pre, .html code { font: 12.5px/1.4 ui-monospace, monospace; background: var(--panel-2); border-radius: 4px; }
  .html pre { padding: 6px 8px; overflow-x: auto; }
  .html code { padding: 0 3px; }
  .html pre code { padding: 0; background: none; }
  .html blockquote { margin: 4px 0; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--dim); }
  .html blockquote.reply { border-left-color: var(--accent); background: var(--panel-2); border-radius: 0 6px 6px 0; }
  .html blockquote.reply strong { display: block; color: var(--text); font-size: 12.5px; }
  .html img { max-width: min(100%, 420px); max-height: 360px; height: auto; border-radius: 6px; display: block; margin: 4px 0; }
  .html img.emoji { display: inline; height: 1.4em; width: auto; margin: 0; vertical-align: -.3em; border-radius: 0; }
  .html a { color: var(--accent); }
  .html table { border-collapse: collapse; }
  .html td, .html th { border: 1px solid var(--line); padding: 2px 6px; }
  .mention { color: var(--mention); font-weight: 600; }
  .mention-me { background: var(--mention-soft); border-radius: 4px; padding: 0 3px; }
  .msg.deleted .html { color: var(--faint); font-style: italic; }
  .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .reacts > * { font-size: 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 0 7px; }
  .reacts button { cursor: pointer; }
  .reacts button:hover:not(.mine) { border-color: var(--dim); }
  .reacts > .mine { border-color: var(--accent); background: var(--accent-soft); }
  body.readonly .reacts button { pointer-events: none; }
  /* ≥2 consecutive deleted messages: the first carries the "N messages deleted" toggle, the rest fold. */
  .msg.folded { display: none; }
  .msg.run-head:not(.open) > :not(.run) { display: none; }
  .msg > .run { grid-column: 1 / -1; justify-self: start; border: 0; background: transparent; padding: 0 4px; border-radius: 6px;
    cursor: pointer; color: var(--faint); font-style: italic; font-size: 12.5px; }
  .msg > .run:hover { color: var(--dim); background: var(--panel-2); }
  .msg > .run::before { content: "▸ "; font-style: normal; }
  .msg.open > .run::before { content: "▾ "; }
  /* Cards: the server's card markup (render.cards_html), inside the sanitised body. */
  .html .card { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--panel);
    padding: 6px 10px; margin: 4px 0; max-width: 560px; }
  .html .card-app { font-size: 11.5px; color: var(--faint); margin-bottom: 2px; }
  .html .card-fallback { color: var(--dim); }
  .html .card .tb { margin: 2px 0; }
  .html .card .w-bolder { font-weight: 650; }
  .html .card .s-small { font-size: 12px; }
  .html .card .s-medium { font-size: 15px; }
  .html .card .s-large { font-size: 17px; }
  .html .card .subtle { color: var(--dim); }
  .html .card .cols { display: flex; gap: 10px; }
  .html .card .col { flex: 1 1 0; min-width: 0; }
  .html .card table.facts { border-collapse: collapse; margin: 4px 0; }
  .html .card .facts th, .html .card .facts td { border: 0; padding: 1px 12px 1px 0; text-align: left; vertical-align: top; }
  .html .card .facts th { font-weight: 600; white-space: nowrap; }
  .html .card .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .html .card .act { border: 1px solid var(--line); border-radius: 8px; padding: 1px 10px; font-size: 12.5px; background: var(--panel-2);
    color: var(--dim); text-decoration: none; }
  .html .card a.act { color: var(--accent); }
  .html .card a.act:hover { border-color: var(--accent); }
  .html .card details { margin-top: 4px; }
  .html .card summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .msg.system { display: block; text-align: center; color: var(--faint); font-size: 12.5px; padding: 2px 8px; }
  .msg.system .html { display: inline; }
  .actions { display: none; position: absolute; right: 8px; top: -10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow); padding: 2px; }
  /* A click focuses the message itself (not focus-visible): no bar pinned. Not `:has(:focus-visible)`:
     Chrome drops the focus when Tab leaves the message for its first button. */
  .msg:hover .actions, .msg:focus-visible .actions, .msg:focus-within:not(:focus) .actions { display: flex; }
  .msg:has(.editor) .actions { display: none !important; }  /* outranks the focus-within rule: the editor holds focus */
  .actions button { border: 0; background: transparent; border-radius: 6px; padding: 0 6px; cursor: pointer; color: var(--dim); font-size: 12.5px; }
  .actions button:hover { background: var(--panel-2); color: var(--accent); }
  .actions .picker { display: flex; border-left: 1px solid var(--line); margin-left: 2px; padding-left: 2px; }
  .actions .picker[hidden] { display: none; }
  .actions .picker button.mine { background: var(--accent-soft); }
  body.readonly .actions [data-act]:not([data-act="teams"]) { display: none; }
  /* innerText skips what is not displayed: an edit starts from the message without its quotes. */
  .plain blockquote.reply, .plain .card { display: none; }
  .editor { display: block; width: 100%; resize: vertical; font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; }
  .edit-err { display: block; color: var(--hot); font-size: 12px; }
  #quotes { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
  #quotes[hidden] { display: none; }
  .quote { display: flex; align-items: center; gap: 6px; border-left: 3px solid var(--accent); background: var(--panel-2);
    border-radius: 0 6px 6px 0; padding: 2px 4px 2px 8px; font-size: 12.5px; color: var(--dim); }
  .quote b { color: var(--text); font-weight: 600; white-space: nowrap; }
  .quote span { flex: 1; }
  .quote button { border: 0; background: transparent; cursor: pointer; color: var(--dim); border-radius: 4px; }
  .quote button:hover { color: var(--hot); }
  /* Avatars off: no avatar column, the same rhythm as the widget's compact mode. */
  body.compact .msg { grid-template-columns: minmax(0, 1fr); }
  body.compact .av { display: none; }
  body.compact .body { grid-column: 1; }
  body.compact .msg:not(.cont) { margin-top: 6px; }

  #typing { flex: none; min-height: 1.45em; padding: 0 20px; color: var(--typing); font-style: italic; font-size: 12.5px; }
  footer { flex: none; padding: 0 12px 10px; }
  #reply { display: block; width: 100%; resize: none; max-height: calc(8lh + 14px); overflow-y: auto; font: inherit; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  #reply:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #reply:disabled { opacity: .6; }
  #err { display: block; color: var(--hot); font-size: 12px; margin-top: 2px; min-height: 0; }
</style>
</head>
<body>
<header>
  <a id="back" href="/?nav=chat" title="back to the chat list">◀</a>
  <h1 id="label" class="truncate">…</h1>
  <span id="members"></span>
  <span id="status" class="off" title="connecting…"></span>
  <input id="find" type="search" placeholder="search · Enter" aria-label="search this chat">
  <input id="day" type="date" title="jump to a day" aria-label="jump to a day">
  <button id="teams" class="btn" title="open this chat in Teams" disabled>Open in Teams</button>
  <div id="hits" hidden></div>
</header>
<div id="pane">
  <div id="list"><div id="note">loading…</div><div id="msgs"></div></div>
  <button id="latest" class="btn" hidden>↓ latest</button>
</div>
<div id="typing" aria-live="polite"></div>
<footer>
  <div id="quotes" hidden></div>
  <textarea id="reply" rows="1" placeholder="message · Enter sends, Shift+Enter new line" aria-label="message"></textarea>
  <small id="err"></small>
</footer>
<script>
(() => {
  let thread = null;
  try { thread = decodeURIComponent(location.pathname.slice("/chat/".length)); } catch (e) {}
  const $list = document.getElementById("list"), $msgs = document.getElementById("msgs"), $note = document.getElementById("note"),
        $label = document.getElementById("label"), $members = document.getElementById("members"),
        $status = document.getElementById("status"), $teams = document.getElementById("teams"),
        $typing = document.getElementById("typing"), $reply = document.getElementById("reply"), $err = document.getElementById("err"),
        $quotes = document.getElementById("quotes"), $latest = document.getElementById("latest"),
        $find = document.getElementById("find"), $day = document.getElementById("day"), $hits = document.getElementById("hits");
  const store = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const q = new URLSearchParams(location.search), pref = (k) => q.get(k) ?? store(k);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  // Same colour and initials rules as the widget's rows.
  const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const initials = (name) => { const w = name.split(/[ ,]+/).filter((x) => /\p{L}/u.test(x));
    return ((w[0] || "?")[0] + ((w[1] || "")[0] || "")).toUpperCase(); };

  let ws = null, opener = false, sending = false, retry = 1000, loaded = false, followFailed = false, pageVersion = null;
  const records = new Map();  // id → record, for the messages on screen
  const pending = new Set();  // history requests asked and not answered: "<kind>:<cursor>", "" = latest page
  // Relayed frames the screen cannot take yet: while a page that replaces it is read, or while
  // detached (`newer`), where they wait for the page to reach the latest message.
  let live = [], liveEdits = [];
  let older = false, newer = false;  // more history above / below what is shown; `newer` = detached by a jump
  let unseen = 0;  // live messages received while the latest one was out of view
  let source = "archive", target = null, restore = null;  // target: a jump's {at, id}; restore: a reconnect's anchor
  let aroundAt = "";  // the one `around` page still wanted: an answer for another is stale
  const LIVE_MAX = 600;  // messages kept on screen at the bottom (and buffered while detached)
  const EDGE = 150;  // px from the top or bottom that loads the next page
  const typing = new Set();
  // Teams' 8 default reactions, the keys `react` accepts (messages.EMOJI).
  const EMOJI = { like: "👍", heart: "❤️", laugh: "😆", surprised: "😮", sad: "😢", angry: "😡", yes: "✅", no: "❌" };
  const QUOTE_MAX = 10;
  let quotes = [];  // [{id, name, line}] quoted by the next send, in the order picked

  const applyPrefs = () => {
    const theme = ["light", "dark"].includes(pref("theme")) ? pref("theme") : "auto";
    if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    document.body.classList.toggle("compact", pref("avatars") === "0");
  };
  addEventListener("storage", applyPrefs);  // the widget tab changed theme or avatars

  const send = (obj) => { if (!(ws && ws.readyState === 1)) return false; ws.send(JSON.stringify(obj)); return true; };
  // Same shape as web.deep_link's https form.
  const CTX = encodeURIComponent('{"contextType":"chat"}');
  const teamsLink = (msgId) => msgId
    ? `https://teams.microsoft.com/l/message/${encodeURIComponent(thread)}/${msgId}?context=${CTX}`
    : `https://teams.microsoft.com/l/chat/${encodeURIComponent(thread)}/conversations?context=${CTX}`;
  // Through the server's opener (desktop client) when it has one, else the https link in a new tab.
  const openTeams = (msgId) => {
    if (opener && send({ open: thread, msg: msgId || "" })) return;
    window.open(teamsLink(msgId), "_blank", "noopener");
  };
  const lastId = () => $msgs.lastElementChild?.dataset.id || "";
  $teams.onclick = () => openTeams(lastId());

  const near = (px = 40) => $list.scrollHeight - $list.scrollTop - $list.clientHeight < px;
  let stick = true;
  const showLatest = () => {
    $latest.hidden = !newer && near();
    $latest.textContent = unseen ? `↓ latest (${unseen})` : "↓ latest";
  };
  const firstAt = () => $msgs.firstElementChild?.dataset.at || "", lastAt = () => $msgs.lastElementChild?.dataset.at || "";
  $list.addEventListener("scroll", () => {
    stick = !newer && near();
    if (stick) unseen = 0;
    showLatest();
    if (!loaded || pending.size) return;  // one page at a time: the server answers `busy` to a second
    if (older && $list.scrollTop < EDGE) requestHistory("before", firstAt());
    else if (newer && near(EDGE)) requestHistory("after", lastAt());
  });
  // A page shorter than the list never scrolls: ask the next one without waiting for a scroll.
  // The edge `fill` last asked: asked again, it would bring nothing again. A new screen clears it, so
  // it only stops two identical asks in a row.
  let filled = "";
  const fill = () => {
    if (pending.size || $list.scrollHeight > $list.clientHeight) return;
    const [kind, at] = older ? ["before", firstAt()] : newer ? ["after", lastAt()] : ["", ""];
    if (!at || kind + at === filled) return;
    filled = kind + at;
    requestHistory(kind, at);
  };
  const toBottom = () => { $list.scrollTop = $list.scrollHeight; stick = !newer; if (stick) unseen = 0; showLatest(); };
  const byId = (id) => $msgs.querySelector(`[data-id="${CSS.escape(id)}"]`);
  // The reader's place as a message and its offset, not pixels: pages above it change the pixels.
  const anchor = () => {
    const top = $list.getBoundingClientRect().top;
    const n = [...$msgs.children].find((x) => x.getBoundingClientRect().bottom > top);
    return n ? { id: n.dataset.id, offset: n.getBoundingClientRect().top - top } : null;
  };
  const toAnchor = (a) => {
    let n = a && byId(a.id);
    if (!n) return false;
    while (n.classList.contains("folded")) n = n.previousElementSibling;  // folded: no box to measure
    $list.scrollTop += n.getBoundingClientRect().top - $list.getBoundingClientRect().top - a.offset;
    return true;
  };
  // A jump's message: the hit itself, else the first message at or after the picked time.
  const land = (t) => {
    let n = (t.id && byId(t.id)) || [...$msgs.children].find((x) => x.dataset.at >= t.at) || $msgs.lastElementChild;
    if (!n) return;
    while (n.classList.contains("folded")) n = n.previousElementSibling;  // a folded run shows its head
    for (const old of $msgs.querySelectorAll(".hit")) old.classList.remove("hit");
    n.classList.add("hit");
    n.scrollIntoView({ block: t.id ? "center" : "start" });
  };
  // Images grow the list after it was laid out: keep the bottom in view when it was.
  $list.addEventListener("load", () => { if (stick) toBottom(); }, true);

  const fmtTime = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    return d.toDateString() === new Date().toDateString() ? hm : d.toLocaleDateString([], { day: "numeric", month: "short", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" }) + " " + hm;
  };

  // The one place a record becomes DOM. `html` is the server's sanitised body: the only markup the page inserts.
  const renderMessage = (r) => {
    const sys = r.type === "system" || r.type === "call";
    const node = el("div", "msg" + (r.me ? " me" : "") + (r.deleted ? " deleted" : "") + (sys ? " system" : ""));
    node.dataset.id = r.id; node.dataset.from = r.from || ""; node.dataset.at = r.at || "";
    const body = el("div", "body");
    if (r.deleted) body.append(el("div", "html", "message deleted"));
    else { const h = el("div", "html"); h.innerHTML = r.html || ""; body.append(h); }
    if (sys) { node.append(body); node.title = r.at; return node; }
    node.tabIndex = 0;  // keyboard users reach the actions through focus-visible
    const name = r.name || (r.me ? "You" : "?");
    const av = el("div", "av", initials(name));
    av.style.background = `linear-gradient(135deg, hsl(${hue(r.from || name)} 62% 58%), hsl(${(hue(r.from || name) + 40) % 360} 62% 48%))`;
    const head = el("div", "head");
    head.append(el("b", null, name), Object.assign(el("span", "when", fmtTime(r.at)), { title: r.at }));
    if (r.edited && !r.deleted) head.append(el("span", "edited", "edited"));
    body.prepend(head);
    if (!r.deleted && r.reactions && r.reactions.length) {
      const line = el("div", "reacts");
      for (const x of r.reactions) {
        // `react` refuses keys outside Teams' 8: those chips only show the count.
        const live = !readOnly && Object.hasOwn(EMOJI, x.key);
        const chip = el(live ? "button" : "span", x.mine ? "mine" : null, `${x.emoji} ${x.count}`);
        chip.title = x.key;
        if (live) {
          chip.setAttribute("aria-label", `${x.emoji} ${x.count}, ${x.mine ? "remove" : "add"}`);
          chip.onclick = () => readOnly || send({ react: thread, msg: r.id, key: x.key, remove: x.mine }) || ($err.textContent = "offline, not sent");
        }
        line.append(chip);
      }
      body.append(line);
    }
    const actions = el("div", "actions");
    actions.onmousedown = (e) => e.preventDefault();  // a mouse click must not leave focus on the button and pin the bar
    const button = (act, text, title, onclick) => { const b = el("button", null, text); b.dataset.act = act; b.title = title; b.setAttribute("aria-label", title); b.onclick = onclick; actions.append(b); return b; };
    if (!r.deleted) {
      button("reply", "↩", "reply with quote", () => addQuote(r, node));
      const picker = el("span", "picker");
      picker.hidden = true;
      for (const [key, emoji] of Object.entries(EMOJI)) {
        const mine = (r.reactions || []).some((x) => x.key === key && x.mine);
        const b = el("button", mine ? "mine" : null, emoji);
        b.dataset.key = key; b.title = mine ? `remove ${key}` : key; b.setAttribute("aria-label", b.title);
        b.onclick = () => { picker.hidden = true; send({ react: thread, msg: r.id, key, remove: mine }) || ($err.textContent = "offline, not sent"); };
        picker.append(b);
      }
      button("react", "☺", "react", () => { picker.hidden = !picker.hidden; });
      actions.append(picker);
      node.addEventListener("mouseleave", () => { picker.hidden = true; });
      node.addEventListener("keydown", (e) => { if (e.key === "Escape") picker.hidden = true; });
      if (r.me && r.editable) button("edit", "✎", "edit", () => startEdit(node, r));
      if (r.me) {
        button("delete", "🗑", "delete", () => { if (confirm("Delete this message?")) send({ delete: thread, msg: r.id }) || ($err.textContent = "offline, not deleted"); });
      }
    }
    button("teams", "↗ Teams", "open this message in Teams", () => openTeams(r.id));
    node.append(av, body, actions);
    return node;
  };

  // The rendered body as plain text, its reply quotes left out (they are lost on edit).
  const plainOf = (node) => {
    const h = node.querySelector(".html");
    if (!h) return "";
    h.classList.add("plain");
    const text = h.innerText;
    h.classList.remove("plain");
    return text.trim();
  };

  const renderQuotes = () => {
    $quotes.replaceChildren(...quotes.map((q, i) => {
      const chip = el("div", "quote"), drop = el("button", null, "✕");
      chip.dataset.quote = q.id;
      drop.title = "drop this quote"; drop.setAttribute("aria-label", drop.title);
      drop.onclick = () => { quotes.splice(i, 1); renderQuotes(); };
      chip.append(el("b", null, q.name), el("span", "truncate", q.line), drop);
      return chip;
    }));
    $quotes.hidden = !quotes.length;
  };
  const addQuote = (r, node) => {
    if (quotes.some((q) => q.id === r.id)) return;
    if (quotes.length >= QUOTE_MAX) { $err.textContent = `${QUOTE_MAX} quotes at most`; return; }
    quotes.push({ id: r.id, name: r.name || (r.me ? "You" : "?"), line: plainOf(node).split("\n")[0] });
    renderQuotes();
    $reply.focus();
  };

  // Edit in place: the body becomes a textarea; only the ack, a delete echo or Escape puts a message back.
  const rerender = (id) => {
    const node = $msgs.querySelector(`[data-id="${CSS.escape(id)}"]`), r = records.get(id);
    if (node && r) { node.replaceWith(renderMessage(r)); regroup(); }
  };
  const startEdit = (node, r, text = null, focus = true, note = "") => {
    const h = node.querySelector(".html");
    if (!h || node.querySelector(".editor")) return;
    const box = el("textarea", "editor"), err = el("small", "edit-err");
    box.value = text ?? plainOf(node);
    err.textContent = note;
    box.rows = Math.min(8, box.value.split("\n").length);
    box.onkeydown = (e) => {
      if (e.key === "Escape") { e.preventDefault(); rerender(r.id); return; }
      if (e.key !== "Enter" || e.shiftKey || e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      if (box.dataset.saving) return;  // a flag, not `disabled`: Escape must still reach the field
      if (!send({ edit: thread, msg: r.id, text: box.value })) { err.textContent = "offline, not saved"; return; }
      err.textContent = ""; box.dataset.saving = "1";
    };
    h.replaceWith(box, err);
    if (focus) box.focus();
  };
  const onAction = (m) => {
    if (m.edit !== undefined) {
      const node = $msgs.querySelector(`[data-id="${CSS.escape(m.msg || "")}"]`), box = node?.querySelector(".editor");
      // No editor waiting for it (cancelled, malformed id): only a failure is worth saying.
      if (!box?.dataset.saving) { if (m.error) $err.textContent = "edit: " + m.error; return; }
      delete box.dataset.saving;
      if (m.ok) { rerender(m.msg); return; }
      box.focus();
      node.querySelector(".edit-err").textContent = m.error || "not saved";
      return;
    }
    if (m.error) $err.textContent = ("react" in m ? "reaction: " : "delete: ") + m.error;
  };

  // Bots delete their old notifications in bulk: ≥2 consecutive deleted messages fold behind one line.
  const unfolded = new Set();  // members of the runs the reader opened: a run grows at either end
  const fold = () => {
    for (const b of $msgs.querySelectorAll(":scope > .msg > .run")) b.remove();
    let run = [];
    const close = () => {
      const members = run, many = members.length > 1, head = members[0];
      const open = many && members.some((n) => unfolded.has(n.dataset.id));
      run = [];
      members.forEach((n, i) => {
        n.classList.toggle("in-run", many); n.classList.toggle("run-head", many && !i);
        n.classList.toggle("folded", many && i > 0 && !open); n.classList.toggle("open", open);
      });
      if (!many) return;
      const b = el("button", "run", `${members.length} messages deleted`);
      b.setAttribute("aria-expanded", String(open));
      b.onclick = () => {
        for (const n of members) if (open) unfolded.delete(n.dataset.id); else unfolded.add(n.dataset.id);
        fold();
        head.querySelector(":scope > .run")?.focus();
      };
      head.prepend(b);
    };
    for (const n of $msgs.children) { if (n.classList.contains("deleted")) run.push(n); else close(); }
    close();
  };

  // Consecutive messages from one sender within 5 minutes share one avatar and name.
  const regroup = () => {
    fold();
    let prev = null;
    for (const n of $msgs.children) {
      const cont = !!prev && !n.classList.contains("system") && !prev.classList.contains("system")
        && prev.classList.contains("in-run") === n.classList.contains("in-run")
        && prev.dataset.from === n.dataset.from && Date.parse(n.dataset.at) - Date.parse(prev.dataset.at) < 300000;
      n.classList.toggle("cont", cont);
      prev = n;
    }
  };

  // A page that replaces the screen: the latest one, a jump, a reconnect.
  const showPage = (messages, more, jumped = false) => {
    // Restored editors start idle: a save in flight lost its answer with the old socket (see onclose).
    const editing = [...$msgs.querySelectorAll(".editor")].map((box) => ({ id: box.closest(".msg").dataset.id, text: box.value,
      focused: box === document.activeElement, note: box.nextElementSibling?.textContent || "" }));
    older = !!more.older; newer = !!more.newer;
    filled = "";
    records.clear();
    for (const r of messages) records.set(r.id, r);
    if (!newer) {  // landed while the page was read, or while detached
      for (const r of live) if (!records.has(r.id)) records.set(r.id, r);
      live = [];
    }
    $msgs.replaceChildren(...[...records.values()].map(renderMessage));
    regroup();
    const edits = liveEdits;
    liveEdits = [];
    for (const r of edits) replace(r);
    for (const e of editing) {
      const node = $msgs.querySelector(`[data-id="${CSS.escape(e.id)}"]`), r = records.get(e.id);
      if (node && r && !r.deleted) startEdit(node, r, e.text, e.focused, e.note);
      else $err.textContent = "edit lost: the message is no longer shown";
    }
    $note.hidden = records.size > 0;
    $note.className = ""; $note.textContent = "no message yet";
    loaded = true;
    const t = jumped ? target : null, back = restore;
    if (jumped) target = null;
    restore = null;
    if (t) land(t);
    else if (!toAnchor(back)) toBottom();
    stick = !newer && near();
    showLatest();
    fill();
  };
  // A page next to the screen: older above with the visible message kept in place, newer below.
  const addPage = (messages, above) => {
    const a = above && anchor();
    const nodes = messages.filter((r) => !records.has(r.id)).map((r) => { records.set(r.id, r); return renderMessage(r); });
    if (above) $msgs.prepend(...nodes); else $msgs.append(...nodes);
    if (!above && !newer) {  // reached the latest message: what arrived while detached follows it
      for (const r of live) if (!records.has(r.id)) { records.set(r.id, r); $msgs.append(renderMessage(r)); }
      live = [];
    }
    regroup();
    if (a) toAnchor(a);
    $note.hidden = records.size > 0;
    showLatest();
    if (nodes.length) fill();
  };
  const replacing = () => [...pending].some((k) => !k || k.startsWith("around:"));

  // A long-open busy chat: the reader at the bottom keeps the newest LIVE_MAX, scrolling up reloads the rest.
  const trim = () => {
    const cut = [...$msgs.children].slice(0, Math.max(0, $msgs.children.length - LIVE_MAX));
    const editor = cut.findIndex((n) => n.querySelector(".editor"));
    if (editor >= 0) cut.length = editor;  // an unsaved edit outlives the trim
    if (!cut.length) return;
    for (const n of cut) { records.delete(n.dataset.id); n.remove(); }
    older = true;
    regroup();
  };

  const append = (r) => {
    if (newer || replacing()) {
      if (!live.some((x) => x.id === r.id)) live.push(r);
      if (live.length > LIVE_MAX) live.shift();
    }
    if (newer) { unseen++; showLatest(); return; }  // not after what is shown: it waits for the latest page
    if (records.has(r.id)) return;
    const was = stick;
    records.set(r.id, r);
    $msgs.append(renderMessage(r));
    regroup();
    $note.hidden = true;
    if (was) { trim(); toBottom(); } else { unseen++; showLatest(); }
  };

  const replace = (r) => {
    if (replacing()) liveEdits.push(r);
    const held = live.findIndex((x) => x.id === r.id);  // detached: it is shown once the latest page is
    if (held >= 0) live[held] = "html" in r ? r : { ...live[held], ...r, html: live[held].html };
    const old = records.get(r.id), node = $msgs.querySelector(`[data-id="${CSS.escape(r.id)}"]`);
    if (!old || !node) return;  // not on screen: the next page read carries it
    const merged = "html" in r ? r : { ...old, ...r, html: old.html };  // a partial update keeps the body
    records.set(r.id, merged);
    if (node.querySelector(".editor") && !merged.deleted) return;  // an edit in progress: shown once it ends
    node.replaceWith(renderMessage(merged));
    regroup();
  };

  // History is keyed on its cursor, which the answer echoes: one request per cursor in flight.
  const requestHistory = (kind = "before", at = "") => {
    const key = at ? kind + ":" + at : "";
    if (pending.has(key)) return;
    if (!send({ history: thread, [kind]: at || null })) return;
    pending.add(key);
    if (!at && !newer) { live = []; liveEdits = []; }  // attached: what came before is on screen
  };
  const jump = (at, id = "") => { target = { at, id }; aroundAt = at; requestHistory("around", at); };
  const onHistory = (m) => {
    const kind = ["after", "around"].find((k) => k in m) || "before", at = m[kind] || "";
    pending.delete(at ? kind + ":" + at : "");
    if (kind === "around" && at !== aroundAt) return;  // a later jump (or the latest page) replaced it
    if (m.error === "busy") { setTimeout(() => requestHistory(kind, at), 500); return; }
    if (kind === "around") aroundAt = "";
    if (m.error) {
      if (kind === "around" && restore) { restore = null; requestHistory(); return; }  // a reconnect: the latest page then
      if (kind !== "before" && at) { $err.textContent = (kind === "around" ? "jump: " : "history: ") + m.error; target = null; return; }
      if (followFailed) return;  // its error says more than this one
      $note.hidden = false; $note.className = "err";
      $note.textContent = "history: " + m.error;
      return;
    }
    source = m.source;
    const messages = m.messages || [];
    if (!at || kind === "around") showPage(messages, m, kind === "around");
    // A page asked for an edge that has moved since (a jump, a trim) is stale: the next scroll asks again.
    else if (kind === "before" && at === firstAt()) { older = !!m.older; addPage(messages, true); }
    else if (kind === "after" && at === lastAt()) { newer = !!m.newer; addPage(messages, false); }
  };
  $latest.onclick = () => {
    if (!newer) { toBottom(); return; }
    target = restore = null; aroundAt = "";
    requestHistory();  // showPage ends at the bottom
  };

  const onSearch = (m) => {
    if (m.q !== $find.dataset.q) return;  // an answer to a search since replaced
    if (m.error === "busy") { setTimeout(() => send({ search: thread, q: m.q }), 500); return; }
    $hits.replaceChildren();
    if (m.error) $hits.append(el("div", "none err", m.error));
    else if (!(m.hits || []).length) $hits.append(el("div", "none", "no match"));
    for (const h of m.hits || []) {
      const b = el("button");
      b.dataset.id = h.id;
      b.append(el("b", null, h.name || "?"), el("span", "when", fmtTime(h.at)), el("div", "truncate", h.text));
      b.onclick = () => { $hits.hidden = true; jump(h.at, h.id); };
      $hits.append(b);
    }
    $hits.hidden = false;
  };
  // Closing the results drops the search: its answer, or a busy retry, must not reopen them.
  const closeHits = () => { $hits.hidden = true; delete $find.dataset.q; };
  $find.onkeydown = (e) => {
    if (e.key === "Escape") { closeHits(); return; }
    if (e.key !== "Enter" || e.isComposing) return;
    e.preventDefault();
    const q = $find.value.trim();
    if (!q) return;
    $find.dataset.q = q;
    if (!send({ search: thread, q })) { $hits.replaceChildren(el("div", "none err", "offline")); $hits.hidden = false; }
  };
  document.addEventListener("click", (e) => { if (!$hits.contains(e.target) && e.target !== $find) closeHits(); });
  // Chrome fires `change` for each typed digit of the year (0002, 0020, 0202…): jump once the field settles.
  let dayTimer = 0, dayAsked = "";
  const pickDay = () => {
    clearTimeout(dayTimer);
    const [y, mo, d] = $day.value.split("-").map(Number);
    if (!(y >= 1970) || $day.value === dayAsked) return;
    dayAsked = $day.value;
    const start = new Date(0);
    start.setFullYear(y, mo - 1, d); start.setHours(0, 0, 0, 0);  // the start of the day where the reader is
    jump(start.toISOString());
  };
  $day.onchange = () => { clearTimeout(dayTimer); dayTimer = setTimeout(pickDay, 800); };
  $day.onkeydown = (e) => { if (e.key === "Enter") pickDay(); };
  $day.onblur = pickDay;
  $day.onfocus = () => { dayAsked = ""; };  // the same day again, later, is a new jump

  const renderTyping = () => { $typing.textContent = typing.size ? "✍ " + [...typing].join(", ") + (typing.size > 1 ? " are" : " is") + " typing…" : ""; };

  const onFollow = (m) => {
    if (m.error) { followFailed = true; $note.hidden = false; $note.className = "err"; $note.textContent = m.error; return; }
    // A newer chat.html on the server (restart, edit): this page is stale, reload it.
    if (m.page) { if (pageVersion && m.page !== pageVersion) { saveDraft(); location.reload(); return; } pageVersion = m.page; }
    followFailed = false;
    if (m.read_only) { readOnly = true; $reply.disabled = true; $reply.placeholder = "read-only: team channel"; document.body.classList.add("readonly"); }
    opener = !!m.opener;
    $teams.disabled = false;
    const label = m.label || thread, n = label.match(/ · (\d+)p$/);
    $label.textContent = n ? label.slice(0, n.index) : label;
    $label.title = thread;
    $members.textContent = n ? n[1] + " members" : "";
    document.title = $label.textContent + " · miniteams";
  };

  // Teams' keys (spec 006): Enter sends, Shift+Enter breaks the line, Ctrl+Enter sends too.
  const grow = () => { $reply.style.height = "auto"; $reply.style.height = $reply.scrollHeight + 2 + "px"; };
  let readOnly = false;
  const setSending = (on) => { sending = on; $reply.disabled = on || readOnly; if (!on) $reply.focus(); };
  // The draft (text and quotes) survives the reload a newer chat.html triggers.
  const draftKey = "draft:" + thread;
  const saveDraft = () => { try { sessionStorage.setItem(draftKey, JSON.stringify({ text: $reply.value, quotes })); } catch (e) {} };
  const takeDraft = () => {
    let d = null;
    try { d = sessionStorage.getItem(draftKey); sessionStorage.removeItem(draftKey); } catch (e) { return null; }
    if (d == null) return null;
    // A page from before the quotes saved the bare text.
    try { const o = JSON.parse(d); if (o && typeof o.text === "string") return o; } catch (e) {}
    return { text: d, quotes: [] };
  };
  const submit = () => {
    const text = $reply.value;
    if (!text.trim() || sending) return;
    const verb = quotes.length ? { send: thread, text, quote: quotes.map((q) => q.id) } : { send: thread, text };
    if (!send(verb)) { $err.textContent = "offline, not sent"; return; }
    $err.textContent = "";
    setSending(true);
  };
  $reply.oninput = grow;
  $reply.onkeydown = (e) => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    submit();
  };
  const onSent = (m) => {
    if (m.sent !== thread || !sending) return;
    if (m.ok) { $reply.value = ""; grow(); $err.textContent = ""; quotes = []; renderQuotes(); }
    else $err.textContent = m.error || "not sent";
    setSending(false);
  };

  const connect = () => {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?chat");
    ws.onopen = () => {
      retry = 1000; $status.title = "live"; $status.classList.remove("off");
      pending.clear();
      send({ follow: thread });
      // After a drop: the reader scrolled up gets the page around their message back, else the latest
      // page, which holds whatever landed meanwhile.
      const back = loaded && !stick ? anchor() : null, at = back && byId(back.id).dataset.at;
      restore = back; target = null; aroundAt = "";  // a jump asked on the dead socket is lost with it
      if (at && source === "archive") { aroundAt = at; requestHistory("around", at); } else requestHistory();
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if ("follow" in m) onFollow(m);
      else if ("history" in m) onHistory(m);
      else if ("search" in m) onSearch(m);
      // Acks name the thread; a relayed `edit` frame carries a record.
      else if (typeof m.edit === "string" || "react" in m || "delete" in m) onAction(m);
      else if (m.msg) {
        append(m.msg);
        if (typing.delete(m.msg.name)) renderTyping();
      }
      else if (m.edit) replace(m.edit);
      else if ("typing" in m) { if (m.on) typing.add(m.typing); else typing.delete(m.typing); renderTyping(); }
      else if ("sent" in m) onSent(m);
    };
    ws.onclose = () => {
      $status.title = "disconnected"; $status.classList.add("off");
      typing.clear(); renderTyping();
      // No ack will come: the message may or may not have gone out.
      if (sending) { $err.textContent = "connection lost: check the chat before resending"; setSending(false); }
      for (const box of $msgs.querySelectorAll(".editor[data-saving]")) {
        delete box.dataset.saving;
        box.nextElementSibling.textContent = "connection lost: check the message before saving again";
      }
      setTimeout(connect, retry); retry = Math.min(retry * 2, 30000);
    };
  };
  applyPrefs();
  if (!thread) {
    $note.className = "err"; $note.textContent = "malformed chat address";
    $reply.disabled = true;
    return;
  }
  const draft = takeDraft();
  if (draft) {
    $reply.value = draft.text; grow();
    if (Array.isArray(draft.quotes)) {
      quotes = draft.quotes.filter((q) => q && typeof q.id === "string").slice(0, QUOTE_MAX)
        .map((q) => ({ id: q.id, name: String(q.name ?? ""), line: String(q.line ?? "") }));
      renderQuotes();
    }
  }
  connect();
  $reply.focus();
})();
</script>
</body>
</html>
