<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniteams chat</title>
<link rel="icon" href="/favicon.svg">
<style>
  /* ui.css */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
  button { font: inherit; color: inherit; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* The split list's filter row shares this height: the two bottom borders read as one line. */
  :root { --bar-h: 47px; }
  header { background: color-mix(in srgb, var(--bg) 85%, transparent); height: var(--bar-h); padding: 0 16px; display: flex; align-items: center;
    gap: 12px; border-bottom: 1px solid var(--line); flex: none; position: relative; z-index: 2; }
  #find { font: inherit; font-size: 12.5px; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 2px 8px; }
  #find { width: 12em; }
  #hits { position: absolute; top: 100%; right: 16px; width: min(440px, 92vw); max-height: 60vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }
  #hits[hidden] { display: none; }
  #hits button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px;
    padding: 4px 8px; cursor: pointer; }
  #hits button:hover, #hits button:focus-visible { background: var(--panel-2); }
  #hits b { font-weight: 600; margin-right: 6px; }
  #hits .none { color: var(--dim); padding: 4px 8px; }
  #hits .none.err { color: var(--hot); }
  #back { color: var(--dim); text-decoration: none; font-size: 15px; border-radius: 8px; padding: 2px 6px; }
  #back:hover { background: var(--panel-2); color: var(--text); }
  #menu, #teams .icon { display: none; }
  /* Narrow chat column: the header keeps one line, the label keeps room to be read. Breakpoints measured:
     the full header needs ~596px with a long label, the compact one ~387px (~350 tightened). */
  @container (max-width: 639px) {
    #teams .full, #members { display: none; }
    #teams .icon { display: inline; }
    #find { width: 8em; }
  }
  @container (max-width: 399px) {
    header { gap: 6px; padding: 0 12px; }
  }

  /* chatnav=split: the board's list beside the chat (rows as in widget.html, scoped: messages hold li too). */
  #side { flex: none; width: var(--side-w, 300px); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line);
    background: var(--bg); container-type: inline-size; }
  #side[hidden], #grip[hidden] { display: none; }
  /* 8px to grab over the 1px border, drawn as a 2px accent line only while it is in use. */
  #grip { flex: none; width: 8px; margin: 0 -4px; cursor: col-resize; position: relative; z-index: 3; touch-action: none; outline: none; }
  #grip::after { content: ""; position: absolute; inset: 0 3px; border-radius: 1px; }
  #grip:hover::after, #grip:focus-visible::after, body.resizing #grip::after { background: var(--accent); }
  body.resizing { user-select: none; cursor: col-resize; }
  @media (width > 700px) { body.side-off #side, body.side-off #grip { display: none; } }
  #side .bar { flex: none; height: var(--bar-h); display: flex; align-items: center; padding: 0 8px; border-bottom: 1px solid var(--line); position: relative; }
  #side .bar > #mode { flex: none; margin-right: 6px; }
  #side .tabs { flex: none; padding: 6px 8px 4px; position: relative; }
  .seg { display: flex; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { flex: 1 1 auto; border: 0; background: transparent; padding: 3px 4px; white-space: nowrap; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 12px; }
  /* Seen and Muted live behind ⋯ until a 360px list (359 inside its 1px border) has room for all five. */
  .seg .x { display: none; }
  @container (min-width: 359px) { .seg .x { display: block; } .seg .more, #more { display: none; } }
  #more { position: absolute; right: 8px; top: 100%; z-index: 4; display: grid; min-width: 120px; padding: 4px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  #more[hidden] { display: none; }
  #more button { border: 0; background: transparent; text-align: left; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  #more button:hover, #more button.on { background: var(--accent-soft); color: var(--accent); }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 550; }
  .seg b { font-weight: 600; margin-left: 3px; font-size: 10.5px; padding: 0 4px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .seg button.mention b { background: var(--mention-soft); color: var(--mention); }
  #filter { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; color: inherit; background: var(--panel-2); border: 0; border-radius: 10px;
    padding: 5px 26px 5px 9px; outline: none; }
  #filter::-webkit-search-cancel-button { display: none; }
  #clear { position: absolute; right: 12px; border: 0; background: transparent; color: var(--dim); border-radius: 6px; width: 20px; height: 20px;
    padding: 0; line-height: 20px; cursor: pointer; }
  #clear[hidden] { display: none; }
  #clear:hover { color: var(--text); background: var(--line); }
  #filter:focus-visible, .seg button:focus-visible, #more button:focus-visible, #grip:focus-visible, #clear:focus-visible,
  #rows .name:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #rows { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 4px 6px; display: grid; align-content: start; gap: 2px; }
  #rows > li { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 0 8px; padding: 7px 8px; border-radius: 10px; align-items: center; position: relative; }
  #rows > li:hover { background: var(--panel); box-shadow: var(--shadow); }
  #rows > li.unread { box-shadow: inset 3px 0 0 var(--stripe); }
  #rows > li.mention { background: var(--mention-soft); box-shadow: inset 3px 0 0 var(--mention); }
  #rows > li.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  #rows > li.cur { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); opacity: 1; }
  #rows .rav { grid-row: 1 / span 2; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 650; font-size: 12.5px; color: #fff; }
  #rows .rav.round { border-radius: 50%; }
  #rows .name { font-weight: 500; color: inherit; text-decoration: none; }
  #rows .name mark { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 2px; }
  #rows > li.unread .name, #rows > li.mention .name { font-weight: 700; }
  /* Colour, not opacity: a faded row takes its time and preview under 4.5:1. */
  #rows > li.seen .name { color: var(--dim); font-weight: 400; }
  #rows .meta { grid-column: 3; grid-row: 1; justify-self: end; display: flex; align-items: center; gap: 4px; }
  #rows .ago { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  #rows > li.unread .ago { color: var(--accent); font-weight: 600; }
  #rows .meta button { display: none; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; height: 20px; padding: 0 5px; font-size: 11.5px; line-height: 18px; cursor: pointer; color: var(--dim); }
  #rows > li:hover .meta button, #rows > li:focus-within .meta button, #rows > li.hold .meta button, #rows > li:has(> .rowmenu) .meta button { display: inline-block; }
  #rows .prev { grid-column: 2; grid-row: 2; color: var(--dim); font-size: 12.5px; }
  #rows .prev b { color: var(--text); font-weight: 550; }
  #rows .prev .at { color: var(--mention); font-weight: 650; }
  #rows .prev.typing { color: var(--typing); font-style: italic; }
  #rows .ind { grid-column: 3; grid-row: 2; justify-self: end; }
  #rows .dot { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #rows .tag { font-size: 10.5px; font-weight: 700; color: var(--on-mention); background: var(--mention); border-radius: 99px; padding: 0 6px; line-height: 16px; white-space: nowrap; }
  #rows .tag.all { background: transparent; color: var(--mention); box-shadow: inset 0 0 0 1px var(--mention); }
  body.compact #rows > li { grid-template-columns: minmax(0,1fr) auto; padding: 5px 8px; }
  body.compact #rows .name, body.compact #rows .prev { grid-column: 1; }
  body.compact #rows .meta, body.compact #rows .ind { grid-column: 2; }
  #nochat { flex: none; padding: 10px 16px; text-align: center; color: var(--dim); }
  #nochat[hidden] { display: none; }
  body.split #menu { display: inline-block; }
  /* Narrow window: the list folds behind ☰ and opens over the chat, which a backdrop dims. */
  @media (max-width: 700px) {
    body.split #grip { display: none; }
    body.split #side { position: fixed; inset: var(--hdr, 0) auto 0 0; width: min(var(--side-w, 300px), 88vw); z-index: 5; box-shadow: var(--shadow); display: none; }
    body.split.nav-open #side { display: flex; }
    body.split.nav-open #main::after { content: ""; position: fixed; inset: var(--hdr, 0) 0 0 0; z-index: 4;
      background: color-mix(in srgb, var(--bg) 60%, transparent); }
  }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  #label { flex: 1 1 auto; min-width: 6em; }
  #members { color: var(--faint); font-size: 12.5px; white-space: nowrap; border-radius: 4px; }
  #members:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Spec 022: the members popover; absolute, so opening it moves neither the header nor the list. */
  #mpop { position: absolute; top: 100%; width: min(280px, 92vw); max-height: 60vh; overflow-y: auto; font-size: 13px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }
  #mpop ul { list-style: none; margin: 0; padding: 0; }
  #mpop li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; }
  #mpop .mav { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 650; color: #fff; }
  #mpop .none { color: var(--dim); padding: 3px 6px; }
  #status { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); flex: none; }
  #status.off { background: var(--hot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 25%, transparent); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 10px; cursor: pointer; color: var(--dim); font-size: 12.5px; white-space: nowrap; }
  a.btn { text-decoration: none; }
  .btn:disabled, a.btn:not([href]) { opacity: .5; cursor: default; }
  .btn:hover:not(:disabled, a:not([href])) { color: var(--accent); border-color: var(--accent); }

  #pane { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  #list { flex: 1; overflow-y: auto; padding: 8px 12px; }
  #latest { position: absolute; right: 20px; bottom: 10px; box-shadow: var(--shadow); color: var(--accent); }
  #latest[hidden] { display: none; }
  #lag { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); pointer-events: none; padding: 3px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--dim); font-size: 12.5px; box-shadow: var(--shadow); white-space: nowrap; }
  #lag[hidden] { display: none; }
  #lag::before { content: ""; display: inline-block; vertical-align: -2px; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent); animation: imgspin 0.8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { #lag::before { animation: none; } }
  #note { text-align: center; color: var(--dim); padding: 1em; }
  #note.err { color: var(--hot); }
  /* Messages not in the chat yet (spec 017), where my next message would be. */
  #outq { display: grid; gap: 6px; padding: 6px 8px 4px 54px; }
  #outq[hidden] { display: none; }
  #outq .qtext { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 0 10px; padding: 4px 80px 4px 8px; border-radius: 10px; position: relative; }
  .msg:not(.cont) { margin-top: 10px; }
  .msg:hover { background: var(--panel); }
  .msg.hit { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  .msg:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 13px; color: #fff; }
  .msg.cont .av, .msg.cont .head { display: none; }
  .body { grid-column: 2; min-width: 0; }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .head b { font-weight: 600; }
  .msg.me .head b { color: var(--accent); }
  .head b.who { cursor: pointer; border-radius: 3px; }
  .head b.who:hover { text-decoration: underline; }
  .head b.who:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .when, .edited { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .html { overflow-wrap: anywhere; }
  .html p { margin: 0; }
  .html p + p, .html ul, .html ol, .html pre, .html table { margin: 4px 0; }
  .html pre, .html code { font: 12.5px/1.4 ui-monospace, monospace; background: var(--panel-2); border-radius: 4px; }
  .html pre { padding: 6px 8px; overflow-x: auto; }
  .html code { padding: 0 3px; }
  .html pre code { padding: 0; background: none; }
  .html blockquote { margin: 4px 0; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--dim); }
  .html blockquote.reply { border-left-color: var(--accent); background: var(--panel-2); border-radius: 0 6px 6px 0; }
  .html blockquote.reply[data-msg] { cursor: pointer; }
  .html blockquote.reply strong { display: block; color: var(--text); font-size: 12.5px; }
  .html img { max-width: min(100%, 420px); max-height: 360px; width: auto; height: auto; border-radius: 6px; display: block; margin: 4px 0; }
  #msgs .html img:not(.emoji) { cursor: zoom-in; }
  #zoom { padding: 0; border: 0; background: transparent; max-width: 96vw; max-height: 96vh; cursor: zoom-out; }
  #zoom::backdrop { background: rgb(0 0 0 / .8); }
  #zoom img { display: block; max-width: 96vw; max-height: 96vh; object-fit: contain; }
  .html img.emoji { display: inline; height: 1.4em; width: auto; margin: 0; vertical-align: -.3em; border-radius: 0; }
  .html a { color: var(--accent); }
  .html table { border-collapse: collapse; }
  .html td, .html th { border: 1px solid var(--line); padding: 2px 6px; }
  .mention { color: var(--mention); font-weight: 600; }
  .mention-me { background: var(--mention-soft); border-radius: 4px; padding: 0 3px; }
  .msg.deleted .html { color: var(--faint); font-style: italic; }
  .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .reacts > * { font-size: 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 0 7px; }
  .reacts button { cursor: pointer; }
  .reacts img.emoji { height: 1.3em; width: auto; vertical-align: -.3em; }
  .custom-emoji { font-size: .85em; padding: 0 4px; border-radius: 4px; background: var(--panel-2); color: var(--dim); }
  .reacts button:hover:not(.mine) { border-color: var(--dim); }
  .reacts > .mine { border-color: var(--accent); background: var(--accent-soft); }
  body.readonly .reacts button { pointer-events: none; }
  /* ≥2 consecutive deleted messages: the first carries the "N messages deleted" toggle, the rest fold. */
  .msg.folded { display: none; }
  .msg.run-head:not(.open) > :not(.run) { display: none; }
  .msg > .run { grid-column: 1 / -1; justify-self: start; border: 0; background: transparent; padding: 0 4px; border-radius: 6px;
    cursor: pointer; color: var(--faint); font-style: italic; font-size: 12.5px; }
  .msg > .run:hover { color: var(--dim); background: var(--panel-2); }
  .msg > .run::before { content: "▸ "; font-style: normal; }
  .msg.open > .run::before { content: "▾ "; }
  /* Cards: the server's card markup (render.cards_html), inside the sanitised body. */
  .html .card { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--panel);
    padding: 6px 10px; margin: 4px 0; max-width: 560px; }
  .html .card-app { font-size: 11.5px; color: var(--faint); margin-bottom: 2px; }
  .html .card-fallback { color: var(--dim); }
  .html .card .tb { margin: 2px 0; }
  .html .card .w-bolder { font-weight: 650; }
  .html .card .s-small { font-size: 12px; }
  .html .card .s-medium { font-size: 15px; }
  .html .card .s-large { font-size: 17px; }
  .html .card .subtle { color: var(--dim); }
  .html .card .cols { display: flex; gap: 10px; }
  .html .card .col { flex: 1 1 0; min-width: 0; }
  .html .card table.facts { border-collapse: collapse; margin: 4px 0; }
  .html .card .facts th, .html .card .facts td { border: 0; padding: 1px 12px 1px 0; text-align: left; vertical-align: top; }
  .html .card .facts th { font-weight: 600; white-space: nowrap; }
  .html .card .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .html .card .act { border: 1px solid var(--line); border-radius: 8px; padding: 1px 10px; font-size: 12.5px; background: var(--panel-2);
    color: var(--dim); text-decoration: none; }
  .html .card a.act { color: var(--accent); }
  .html .card a.act:hover { border-color: var(--accent); }
  .html .card details { margin-top: 4px; }
  .html .card summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .html .file { display: block; width: fit-content; max-width: 560px; border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 8px; background: var(--panel); padding: 4px 10px; margin: 4px 0; text-decoration: none; }
  .html a.file:hover { border-color: var(--accent); }
  .msg.system { display: block; text-align: center; color: var(--faint); font-size: 12.5px; padding: 2px 8px; }
  .msg.system .html { display: inline; }
  .msg.system .when { margin-left: 6px; }
  .actions { display: none; position: absolute; right: 8px; top: -10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow); padding: 2px; }
  /* A click focuses the message itself (not focus-visible): no bar pinned. Not `:has(:focus-visible)`:
     Chrome drops the focus when Tab leaves the message for its first button. */
  .msg:hover .actions, .msg:focus-visible .actions, .msg:focus-within:not(:focus) .actions { display: flex; }
  .msg:has(> .actions > .picker:not([hidden])) .actions { display: flex; }  /* `+` on a message focused by a click */
  .msg:has(.editor) .actions { display: none !important; }  /* outranks the focus-within rule: the editor holds focus */
  .actions :is(button, a) { text-decoration: none; border: 0; background: transparent; border-radius: 6px; padding: 0 6px; cursor: pointer; color: var(--dim); font-size: 12.5px; }
  .actions :is(button, a):hover { background: var(--panel-2); color: var(--accent); }
  .actions .picker { display: grid; grid-template-columns: repeat(4, auto) auto; border-left: 1px solid var(--line); margin-left: 2px; padding-left: 2px; }
  .actions .picker[hidden] { display: none; }
  .actions .picker button.mine { background: var(--accent-soft); }
  .actions .picker .more { grid-column: 5; grid-row: 1 / span 2; }
  .picker img, .favs img { width: 1.2em; height: 1.2em; vertical-align: middle; }
  .esearch { position: relative; display: inline-block; }
  .esearch input { width: 9em; font: inherit; font-size: 12.5px; color: inherit; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 1px 6px; }
  .menu .favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 4px; }
  .menu .favs button, .menu .favtools button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 15px; }
  .menu .favs button.on { border-color: var(--accent); background: var(--accent-soft); }
  .menu .favtools { display: flex; gap: 4px; margin-bottom: 4px; }
  .menu .favtools button { font-size: 12px; }
  .menu .favtools button:last-child { margin-left: auto; }
  body.readonly .actions [data-act]:not([data-act="teams"], [data-act="copy"]) { display: none; }
  /* innerText skips what is not displayed: a quote's line is the message without its own quotes. */
  .plain blockquote.reply, .plain .card { display: none; }
  .editor { display: block; width: 100%; resize: vertical; font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; }
  .editor[readonly] { opacity: .6; }
  .editbox .tools { margin: 2px 0 0; }
  .edit-err, .edit-note { display: block; color: var(--hot); font-size: 12px; }
  .edit-note { color: var(--dim); }
  .edit-note[hidden] { display: none; }
  .blocked { color: var(--dim); font-size: 12px; }
  :is(button, a).link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; text-decoration: underline; }
  #quotes, .editbox .quotes { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
  #quotes[hidden], .editbox .quotes[hidden] { display: none; }
  .quote { display: flex; align-items: center; gap: 6px; border-left: 3px solid var(--accent); background: var(--panel-2);
    border-radius: 0 6px 6px 0; padding: 2px 4px 2px 8px; font-size: 12.5px; color: var(--dim); }
  .quote b { color: var(--text); font-weight: 600; white-space: nowrap; }
  .quote span { flex: 1; }
  .quote button { border: 0; background: transparent; cursor: pointer; color: var(--dim); border-radius: 4px; }
  .quote button:hover { color: var(--hot); }
  /* Read receipts (spec 011): the readers' small avatars by the newest message each one read. They float
     in the message's right gutter: a receipt moving never changes a message's height. */
  .reads { position: absolute; right: 8px; bottom: 4px; width: 68px; display: flex; justify-content: flex-end; align-items: center; }
  .reads .ra { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 7.5px; font-weight: 650;
    color: #fff; box-shadow: 0 0 0 1.5px var(--bg); }
  .reads .more { font-size: 11px; color: var(--dim); margin-left: 3px; }
  /* Avatars off: no avatar column, the same rhythm as the widget's compact mode. */
  body.compact .msg { grid-template-columns: minmax(0, 1fr); }
  body.compact .av { display: none; }
  body.compact .body { grid-column: 1; }
  body.compact .msg:not(.cont) { margin-top: 6px; }

  #typing { flex: none; min-height: 1.45em; padding: 0 20px; color: var(--typing); font-style: italic; font-size: 12.5px; }
  footer { flex: none; padding: 0 12px 10px; position: relative; }
  .tools { display: flex; gap: 2px; margin-bottom: 4px; }
  .tools button { border: 1px solid transparent; background: transparent; border-radius: 6px; min-width: 26px; padding: 0 6px;
    cursor: pointer; color: var(--dim); font-size: 12.5px; line-height: 22px; }
  .tools button:hover { border-color: var(--line); color: var(--accent); }
  .tools [aria-pressed=true] { background: var(--accent-soft); color: var(--accent); }
  .tools .sep { flex: 1; }
  body.readonly #tools, body.readonly #view { display: none; }
  .view { margin-bottom: 4px; padding: 6px 10px; max-height: 40vh; overflow-y: auto; background: var(--panel);
    border: 1px dashed var(--line); border-radius: 10px; }
  .view[hidden] { display: none; }
  .view.err { color: var(--hot); }
  #reply { display: block; width: 100%; resize: none; max-height: calc(8lh + 14px); overflow-y: auto; font: inherit; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  #reply:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #reply:disabled { opacity: .6; }
  #err { display: block; color: var(--hot); font-size: 12px; margin-top: 2px; min-height: 0; }
</style>
</head>
<body>
<aside id="side" hidden>
  <div class="bar">
    <div class="seg" id="mode" role="group" aria-label="arrange chats" hidden></div>
    <input id="filter" type="search" placeholder="filter · Ctrl+K" autocomplete="off" spellcheck="false" aria-label="filter chats by name">
    <button id="clear" title="clear the filter" aria-label="clear the filter" hidden>×</button>
  </div>
  <div class="tabs">
    <div class="seg" id="tabs"></div>
    <div id="more" role="menu" aria-label="more filters" hidden></div>
  </div>
  <div id="nochat" hidden></div>
  <ul id="rows"></ul>
</aside>
<div id="grip" role="separator" aria-orientation="vertical" aria-controls="side" aria-label="resize chat list" tabindex="0" hidden></div>
<div id="main">
<header>
  <button id="menu" class="btn" title="chats" aria-label="chats" aria-controls="side">☰</button>
  <a id="back" href="/?nav=chat" title="back to the chat list">◀</a>
  <h1 id="label" class="truncate">…</h1>
  <span id="members" role="button" aria-expanded="false" aria-controls="mpop" tabindex="0" hidden></span>
  <div id="mpop" role="region" aria-label="chat members" tabindex="0" hidden></div>
  <span id="status" class="off" title="connecting…"></span>
  <input id="find" type="search" placeholder="search · Enter" aria-label="search this chat">
  <a id="teams" class="btn" role="link" target="_blank" rel="noopener" title="open this chat in Teams" aria-label="Open in Teams" aria-disabled="true"><span class="full">Open in Teams</span><span class="icon" aria-hidden="true">↗</span></a>
  <div class="cog" id="cog"><button id="gear" title="settings" aria-label="settings" aria-controls="settings" aria-expanded="false">⚙</button></div>
  <div id="hits" hidden></div>
</header>
<div id="pane">
  <!-- tabindex -1: Firefox would make the scroller a Tab stop of its own, next to the thread's. -->
  <div id="list" tabindex="-1"><div id="note">loading…</div><div id="msgs" role="feed" aria-label="messages"></div><div id="outq" hidden></div></div>
  <button id="latest" class="btn" hidden>↓ latest</button>
  <div id="lag" role="status" hidden>loading latest messages…</div>
</div>
<dialog id="zoom" aria-label="image"><img alt=""></dialog>
<div id="typing" aria-live="polite"></div>
<footer>
  <div id="view" class="view html" hidden aria-label="preview"></div>
  <div id="tools" class="tools" role="toolbar" aria-label="formatting">
    <button data-fmt="bold" title="bold (Ctrl+B)" aria-label="bold"><b>B</b></button>
    <button data-fmt="italic" title="italic (Ctrl+I)" aria-label="italic"><i>I</i></button>
    <button data-fmt="strike" title="strikethrough" aria-label="strikethrough"><s>S</s></button>
    <button data-fmt="code" title="code" aria-label="code">&lt;/&gt;</button>
    <button data-fmt="list" title="list" aria-label="list">•</button>
    <button data-fmt="quote" title="quote" aria-label="quote">❝</button>
    <span class="sep"></span>
    <button id="clip" title="attach files" aria-label="attach files">📎</button>
    <button id="show" title="preview the formatted message" aria-label="preview" aria-pressed="false">preview</button>
  </div>
  <div id="quotes" hidden></div>
  <div id="imgs" class="imgs" hidden></div>
  <textarea id="reply" rows="1" placeholder="message · Enter sends, Shift+Enter new line" aria-label="message"></textarea>
  <div id="pop" hidden></div>
  <small id="err" aria-live="polite"></small>
</footer>
</div>
<script>
(() => {
  // ui.js defines store keep q pref el hue initials wsUrl signIn dial backoff isSeen mentioned kind rowTitle ago foldText filters named marked mentionLine preview likeTitle focusIn itemKey itemOf rowActions sectionList caret firstLine completion insertText formatBar imageQueue sendQueue
  /* ui.js */
  let thread = null;
  try { thread = decodeURIComponent(location.pathname.slice("/chat/".length)); } catch (e) {}
  const $list = document.getElementById("list"), $msgs = document.getElementById("msgs"), $note = document.getElementById("note"),
        $label = document.getElementById("label"), $members = document.getElementById("members"),
        $status = document.getElementById("status"), $teams = document.getElementById("teams"),
        $typing = document.getElementById("typing"), $reply = document.getElementById("reply"), $err = document.getElementById("err"),
        $quotes = document.getElementById("quotes"), $latest = document.getElementById("latest"), $lag = document.getElementById("lag"),
        $find = document.getElementById("find"), $hits = document.getElementById("hits"), $outq = document.getElementById("outq");

  const BUSY_RETRY_MS = 500, BUSY_TRIES = 10;  // the server answers `busy` while it runs this socket's last ask
  const CLOCK_TICK_MS = 30000;  // relative row times
  const GROUP_MS = 300000;
  let ws = null, opener = false, pageVersion = null;
  const retry = backoff();
  // What the screen shows of the chat's history and where a navigation (jump, reconnect) is heading.
  const newHist = () => ({
    loaded: false, followFailed: false,
    records: new Map(),  // id → record, for the messages on screen
    pending: new Set(),  // history requests asked and not answered: "<side>:<cursor>", "" = latest page
    // Relayed frames the screen cannot take yet: while a page that replaces it is read, or while
    // detached (`newer`), where they wait for the page to reach the latest message.
    live: [], liveEdits: [],
    older: false, newer: false,  // more history above / below what is shown; `newer` = detached by a jump
    // Where the next page above / below starts when the server read past rows it could not show (its
    // `cursor`), else "" and the edge message is the cursor.
    olderAt: "", newerAt: "",
    unseen: 0,  // live messages received while the latest one was out of view
    source: "archive", target: null, restore: null,  // target: a jump's {at, id}; restore: a reconnect's anchor
    aroundAt: "",  // the one `around` page still wanted: an answer for another is stale
    stick: true,
    read: true,  // a `read` owed to Teams (spec 020): the chat opened, or someone wrote, since the last one
    // The edge `fill` last asked: asked again, it would bring nothing again. A new screen clears it, so
    // it only stops two identical asks in a row.
    filled: "",
    unfolded: new Set(),  // members of the runs the reader opened: a run grows at either end
    busy: 0,  // `busy` answers in a row to history asks
    retries: new Map(),  // their retry timers by key: a navigation drops them with their keys, its own ask wins
  });
  let hist = newHist();
  // The archive behind the stream (an answer's `behind`, the id it lacks): the latest page is asked
  // again, backing off, and `$lag` shows once it lasts LAG_SHOW_MS, then stays LAG_KEEP_MS: no flash.
  const LAG_SHOW_MS = 600, LAG_KEEP_MS = 400;
  const lag = { id: "", retry: backoff(), ask: 0, show: 0, hide: 0, shownAt: 0 };
  const settle = (now = false) => {
    clearTimeout(lag.ask); clearTimeout(lag.show); clearTimeout(lag.hide);
    lag.id = ""; lag.show = 0; lag.retry.reset();
    if ($lag.hidden) return;
    if (now) { $lag.hidden = true; return; }
    lag.hide = setTimeout(() => { $lag.hidden = true; }, Math.max(0, lag.shownAt + LAG_KEEP_MS - Date.now()));
  };
  const behind = (id) => {
    if (hist.records.has(id)) { settle(); return; }  // the relay brought it meanwhile
    lag.id = id;
    clearTimeout(lag.hide); clearTimeout(lag.ask);
    if ($lag.hidden && !lag.show) lag.show = setTimeout(() => { lag.show = 0; $lag.hidden = false; lag.shownAt = Date.now(); }, LAG_SHOW_MS);
    const t = thread;
    lag.ask = setTimeout(() => { if (t === thread && !hist.newer) { hist.catchUp = true; requestHistory(); } }, lag.retry.next());
  };
  // The one place a navigation in progress is dropped or redirected, per entry point.
  const resetNav = (entry, to = null) => {
    clearTimeout(lag.ask); hist.catchUp = false;  // the navigation's own ask tells whether the archive lags
    for (const [k, r] of hist.retries) { clearTimeout(r); hist.pending.delete(k); }
    hist.retries.clear();
    switch (entry) {
      case "switch": hist = newHist(); settle(true); break;
      case "open": hist.pending.clear(); Object.assign(hist, { restore: to, target: null, aroundAt: "" }); break;  // asks died with the old socket, or a gap superseded them
      case "jump": Object.assign(hist, { target: to, aroundAt: to.at }); break;
      case "latest": Object.assign(hist, { restore: null, target: null, aroundAt: "" }); break;
      case "fallback": hist.restore = null; break;  // a reconnect's anchor failed: the latest page instead
    }
  };
  const split = pref("chatnav") === "split";
  const LIVE_MAX = 600;  // messages kept on screen at the bottom (and buffered while detached)
  const EDGE = 150;  // px from the top or bottom that loads the next page
  const typing = new Set();
  // The picker's favorites (spec 016): an emoji, or a custom one's `<name>;<id> <image id>`, stored like the ⚙
  // settings. An emoji is sent as its code points: the server turns them into Teams' key for it.
  const FAVS = ["👍", "❤️", "😆", "😮", "😢", "😡", "🙏", "🙃"];
  // Teams' key, then the image: the key's tail need not be the image's id.
  const CUSTOM = /^([A-Za-z0-9_+-]{1,64};[\w-]{1,128}) ([\w-]{1,128})$/;
  const favOk = (f) => typeof f === "string" && (CUSTOM.test(f) || f.length <= 32 && /^\p{Emoji}/u.test(f) && /\P{ASCII}/u.test(f));
  const favs = () => {
    try { const v = JSON.parse(store("reactions")); if (Array.isArray(v) && v.length === FAVS.length && v.every(favOk)) return v; } catch (e) {}
    return FAVS;
  };
  const keyOf = (f) => CUSTOM.exec(f)?.[1] ?? [...f].map((c) => c.codePointAt(0).toString(16).padStart(4, "0")).join("-");
  const favName = (f) => CUSTOM.test(f) ? `:${f.split(";")[0]}:` : f;
  const favFace = (f) => { const m = CUSTOM.exec(f); return m ? Object.assign(el("img"), { src: `/emoji/${m[2]}`, alt: favName(f) }) : document.createTextNode(f); };
  const bare = (s) => s.replace(/\uFE0F/g, "");
  // An emoji already under the message reacts with that chip's own key, mine first: Teams keys 👍 `like` or `yes`.
  const chipOf = (r, f) => {
    const same = (r.reactions || []).filter((x) => CUSTOM.test(f) ? x.key === keyOf(f) : bare(x.emoji) === bare(f));
    return same.find((x) => x.mine) || same[0];
  };
  const react = (r, f, toggle) => {
    const x = chipOf(r, f);
    send({ react: thread, msg: r.id, key: x ? x.key : keyOf(f), remove: !!(toggle && x?.mine) }) || ($err.textContent = "offline, not sent");
  };
  const QUOTE_MAX = 10;
  let quotes = [];  // [{id, name, line}] quoted by the next send, in the order picked

  const applyPrefs = () => {
    const theme = ["light", "dark"].includes(pref("theme")) ? pref("theme") : "auto";
    if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    document.body.classList.toggle("compact", pref("avatars") === "0");
  };
  addEventListener("storage", () => { applyPrefs(); renderRows(); });  // the widget tab changed theme or avatars

  const send = (obj) => { if (!(ws && ws.readyState === 1)) return false; ws.send(JSON.stringify(obj)); return true; };
  // Same shape as web.deep_link's https form.
  const CTX = encodeURIComponent('{"contextType":"chat"}');
  const teamsLink = (msgId) => msgId
    ? `https://teams.microsoft.com/l/message/${encodeURIComponent(thread)}/${msgId}?context=${CTX}`
    : `https://teams.microsoft.com/l/chat/${encodeURIComponent(thread)}/conversations?context=${CTX}`;
  // Through the server's opener (desktop client) when it has one, else the https link in a new tab.
  const openTeams = (msgId) => {
    if (opener && send({ open: thread, msg: msgId || "" })) return;
    window.open(teamsLink(msgId), "_blank", "noopener");
  };
  // A real link, for "Copy link address"; a plain click or Enter still goes through openTeams, a modified one is the browser's.
  const teamsA = (a, msgId) => {
    Object.assign(a, { href: teamsLink(msgId()), target: "_blank", rel: "noopener" });
    a.onclick = (e) => { if (e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || !a.href) return; e.preventDefault(); openTeams(msgId()); };
    return a;
  };
  const lastId = () => $msgs.lastElementChild?.dataset.id || "";
  // The authors on screen, newest first: the server follows their presence (spec 015) while the page shows them.
  let authorsTimer = 0, authorsSent = "";
  const authorsSoon = () => {
    clearTimeout(authorsTimer);
    authorsTimer = setTimeout(() => {
      const shown = [...new Set([...$msgs.querySelectorAll(".av[data-pmri]")].reverse().map((a) => a.dataset.pmri))].slice(0, 50);
      const key = shown.join(" ");
      if (key !== authorsSent && send({ authors: shown })) authorsSent = key;
    }, 300);
  };
  // Detached by a jump, the last message shown is not the chat's last: open the chat itself.
  const headId = () => hist.newer ? "" : lastId();
  const teamsOn = (on) => {
    if (on) { $teams.href = teamsLink(headId()); $teams.removeAttribute("aria-disabled"); }
    else { $teams.removeAttribute("href"); $teams.setAttribute("aria-disabled", "true"); }
  };
  teamsA($teams, headId); teamsOn(false);
  // The last message changes under it: the address is the one about to be copied or followed.
  $teams.onpointerenter = $teams.onfocus = $teams.oncontextmenu = () => { if ($teams.href) $teams.href = teamsLink(headId()); };

  const near = (px = 40) => $list.scrollHeight - $list.scrollTop - $list.clientHeight < px;
  // Spec 020. `read` has no answer: one per second per chat, the rest collapsed into one trailing send,
  // gated again when due: the reader may have left the chat or the window meanwhile.
  const READ_MS = 1000, readAt = new Map(), readLater = new Map();
  const autoOn = () => pref("autoread") !== "0";
  const sendRead = (t) => {
    if (readLater.has(t)) return true;
    const wait = (readAt.get(t) || 0) + READ_MS - Date.now();
    if (wait > 0) {
      readLater.set(t, setTimeout(() => { readLater.delete(t); if (t === thread) { hist.read = true; autoRead(); } }, wait));
      return true;
    }
    if (!autoOn() || !send({ read: t })) return false;
    readAt.set(t, Date.now());
    return true;
  };
  // Only what the reader is shown: the newest message in view, the window visible and focused. A page
  // that replaces the screen (a reconnect, a jump) or the archive's lag is awaited: the screen may lack
  // what the row has, and the server marks read up to the row's last message.
  const autoRead = () => {
    if (!hist.read || !hist.loaded || hist.newer || replacing() || lag.id || readOnly || !near()) return;
    if (document.visibilityState !== "visible" || !document.hasFocus()) return;
    if (sendRead(thread)) hist.read = false;
  };
  // A page's message from someone else, newer than the screen's: it came while the socket was down, or
  // the archive lagged. Older ones (scrolling up, a jump) were there before the read marker.
  const owed = (messages) => {
    const last = lastAt();
    if (messages.some((r) => !r.me && !hist.records.has(r.id) && r.at > last)) hist.read = true;
  };
  document.addEventListener("visibilitychange", () => autoRead());
  addEventListener("focus", () => autoRead());
  const showLatest = () => {
    $outq.hidden = hist.newer || !$outq.children.length;  // after the chat's last message, which a jump hides
    $latest.hidden = !hist.newer && near();
    $latest.textContent = hist.unseen ? `↓ latest (${hist.unseen})` : "↓ latest";
  };
  const firstAt = () => $msgs.firstElementChild?.dataset.at || "", lastAt = () => $msgs.lastElementChild?.dataset.at || "";
  const olderEdge = () => hist.olderAt || firstAt(), newerEdge = () => hist.newerAt || lastAt();
  // The next page when the reader is at an edge: on scroll, and after a page past unreadable rows,
  // which may bring nothing to scroll.
  const more = () => {
    if (!hist.loaded || hist.pending.size) return;  // one page at a time: the server answers `busy` to a second
    if (hist.older && $list.scrollTop < EDGE) requestHistory("before", olderEdge());
    else if (hist.newer && near(EDGE)) requestHistory("after", newerEdge());
  };
  // Images loading, scroll anchoring and toBottom only move the list down: only a scroll up leaves the bottom.
  // (Their scroll event can land before the ResizeObserver has caught up with the growth.)
  let lastTop = 0;
  $list.addEventListener("scroll", () => {
    hist.stick = !hist.newer && (near() || (hist.stick && $list.scrollTop >= lastTop));
    lastTop = $list.scrollTop;
    if (hist.stick) hist.unseen = 0;
    showLatest();
    more();
    autoRead();
  });
  // A page shorter than the list never scrolls: ask the next one without waiting for a scroll.
  const fill = () => {
    if (hist.pending.size || $list.scrollHeight > $list.clientHeight) return;
    const [side, at] = hist.older ? ["before", olderEdge()] : hist.newer ? ["after", newerEdge()] : ["", ""];
    if (!at || side + at === hist.filled) return;
    hist.filled = side + at;
    requestHistory(side, at);
  };
  // Reactions, read receipts, loading images grow the messages; the composer, quotes or pasted images
  // shrink the list from below. A reader at the bottom stays there, any other keeps the bottom edge.
  let listH = $list.clientHeight;
  const keepBottom = new ResizeObserver(() => {
    const h = $list.clientHeight;
    if (hist.stick) toBottom();
    else if (listH && h) $list.scrollTop += listH - h;
    listH = h;
  });
  keepBottom.observe($list);
  keepBottom.observe($msgs);
  keepBottom.observe($outq);
  // A message image opens full size; Escape (native to <dialog>) or a click closes it.
  const $zoom = document.getElementById("zoom");
  const zoom = (img) => { Object.assign($zoom.firstElementChild, { src: img.src, alt: img.alt }); $zoom.showModal(); };
  $msgs.addEventListener("click", (e) => {
    const img = e.target.closest(".html img:not(.emoji)");
    if (img && !img.closest("a")) zoom(img);  // a linked image keeps its link
    const q = e.target.closest(".html blockquote[role=link]");
    if (q && !e.target.closest("a") && getSelection().isCollapsed) quoteJump(q.dataset.msg);  // a click ending a selection selects
    const who = e.target.closest(".head .who");
    if (!who || !getSelection().isCollapsed) return;  // a drag selecting the name copies it
    dmAsk(who, e.ctrlKey || e.metaKey);  // Ctrl/⌘ click = middle click, as on the list's rows
    if (e.detail > 0) who.blur();  // a pointer's focus there would pin the action bar; a keyboard's stays
  });
  $msgs.addEventListener("auxclick", (e) => { const who = e.button === 1 && e.target.closest(".head .who"); if (who) dmAsk(who, true); });
  const MAC = /mac/i.test(navigator.userAgentData?.platform ?? navigator.platform);
  const PASS = "a[href], summary, pre";  // a body's own Tab stops: links, card toggles (Action.ShowCard), scrollable code blocks
  $msgs.addEventListener("keydown", (e) => {
    const t = e.target, k = e.key;
    if (k === "Enter" && t.matches(".html blockquote[role=link]")) { e.preventDefault(); quoteJump(t.dataset.msg, true); return; }
    if (k === "Enter" && t.matches(".head .who")) { e.preventDefault(); dmAsk(t, false); return; }
    // A message or a control of its own a click focused: its editor, picker and emoji search keep their keys.
    const m = t.closest("#msgs > .msg");
    const option = MAC && e.altKey && !e.ctrlKey && [...k].length === 1;  // macOS Option types characters (Option+r is ®)
    if (!m || t.closest(".editbox, .picker, .esearch") || e.metaKey || ((e.ctrlKey || e.altKey) && !option && !e.getModifierState("AltGraph"))) return;  // AltGr is Ctrl+Alt on Windows
    if (t !== m && (k === "Enter" || (k === " " && !t.matches("a[href], pre")))) return;  // a link or button keeps Enter, a button its Space
    const all = steps(), i = all.indexOf(m), y = (n) => n.getBoundingClientRect().top, h = $list.clientHeight;
    const move = { ArrowUp: () => all[i - 1] || m, ArrowDown: () => all[i + 1], Home: () => all[0], End: () => all.at(-1),
      PageUp: () => all.findLast((n) => y(n) <= y(m) - h) || all[0], PageDown: () => all.find((n) => y(n) >= y(m) + h) || all.at(-1) }[k];
    const act = (a) => readOnly ? null : m.querySelector(`:scope > .actions > [data-act=${a}]`);
    if (move) { const n = move(); if (n) visit(n); else toComposer(); }  // ↓ past the last message
    else if (k === "Escape") { if (t.matches(`.html :is(${PASS})`)) m.focus(); else toComposer(); }
    else if (k === " ") byScreen(m, e.shiftKey ? -1 : 1);
    else if (k === "e" || k === "r") act(k === "e" ? "edit" : "reply")?.click();
    else if (k === "+") { const b = act("react"), p = m.querySelector(":scope > .actions > .picker"); if (b) { if (p.hidden) b.click(); p.querySelector("button")?.focus(); } }
    else if (k === "p") { const who = m.querySelector(".head .who"); if (who) dmAsk(who, false); }
    else if (k === "Enter") { const q = m.querySelector(".html blockquote[role=link]"), run = m.querySelector(":scope > .run"); if (q) quoteJump(q.dataset.msg, true); else if (run) { run.click(); m.focus(); } else m.querySelector(":scope > .body > .blocked > a")?.click(); }
    else if (k === "/") toFind();
    // Any other character is the reader typing again: it lands at the composer's end.
    else if ([...k].length === 1 && !$reply.disabled) { const at = $reply.value.length; insertText($reply, k, at, at, at + k.length, at + k.length); }
    else return;

    $clear.onclick = () => { clearFilter(); $filter.focus(); };
    $rows.onkeydown = (e) => {
      const li = e.target.closest?.(".name, .shead") && e.target.closest("li");
      if (!li) return;
      if (e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp") && secs.nudge(li.dataset.id, e.key === "ArrowDown" ? 1 : -1)) { e.preventDefault(); return; }
      const side = secs.side(li, e);
      if (side) { e.preventDefault(); highlight(side, true); return; }
      const to = { ArrowDown: li.nextElementSibling, ArrowUp: li.previousElementSibling, Home: $rows.firstElementChild, End: $rows.lastElementChild }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      highlight(to, true);
    };
    $more.onkeydown = (e) => {
      const items = [...$more.children], i = items.indexOf(document.activeElement), n = items.length;
      const to = { ArrowDown: (i + 1) % n, ArrowUp: (i + n - 1) % n, Home: 0, End: n - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      items[to].focus();
    };
    // After the move, not during it: closing re-renders the tabs the focus may be heading to.
    $more.addEventListener("focusout", () => setTimeout(() => {
      if (moreOpen && !$more.contains(document.activeElement)) closeMore(false);
    }));
    addEventListener("popstate", () => {
      let id = null;
      try { id = decodeURIComponent(location.pathname.slice("/chat/".length)); } catch (e) {}
      if (!id) return;
      reveal = id !== thread;
      switchTo(id, false);
    });
    setInterval(renderRows, CLOCK_TICK_MS);
  };

  // After a drop, or frames the server dropped (`gap`): the reader scrolled up gets the page around
  // their message back, else the latest page, which holds whatever landed meanwhile.
  const resync = () => {
    const back = hist.loaded && !hist.stick ? anchor() : null, at = back && byId(back.id).dataset.at;
    resetNav("open", back);  // a jump asked before is superseded
    if (at && hist.source === "archive") { hist.aroundAt = at; requestHistory("around", at); } else requestHistory();
  };
  const connect = () => {
    ws = dial("/ws?chat");
    ws.onopen = () => {
      $status.title = "live"; $status.classList.remove("off");
      send({ follow: thread });
      if (split) send({ board: true });
      authorsSent = ""; authorsSoon();  // a new socket starts with no authors on the server
      resync();
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.rows) { onBoard(m); return; }
      if (m.presence) { paintPresence(m.presence); return; }
      // Relayed frames name their chat: those of a chat left since (split) are dropped.
      if ("thread" in m && m.thread !== thread) return;
      if ("receipts" in m) {
        receipts = m.receipts && typeof m.receipts === "object" ? m.receipts : {};
        paintReceipts();
      }
      else if ("gap" in m) { if (m.gap === thread) resync(); }  // no `thread` key: a gap of a chat left is ignored here
      else if ("follow" in m) onFollow(m);
      else if ("people" in m) { if (m.members === thread) setRoster(m); }  // a chat left since: dropped
      else if ("dm" in m) onDm(m);
      else if ("history" in m) onHistory(m);
      else if ("search" in m) onSearch(m);
      else if ("complete" in m) { complete.answered(m); esearch.answered(m); for (const w of $msgs.querySelectorAll(".editbox")) w.ed.complete.answered(m); }
      else if ("preview" in m) onPreview(m);
      else if ("editable" in m) onEditable(m);  // before `m.msg`: its answer names the message by id
      // Acks name the thread; a relayed `edit` frame carries a record.
      else if (typeof m.edit === "string" || "react" in m || "delete" in m) onAction(m);
      else if (m.msg) {
        append(m.msg);
        if (typing.delete(m.msg.name)) renderTyping();
      }
      else if (m.edit) replace(m.edit);
      else if ("typing" in m) { if (m.on) typing.add(m.typing); else typing.delete(m.typing); renderTyping(); }
      else if ("sent" in m) onSent(m);
    };
    ws.onclose = () => {
      $status.title = "disconnected"; $status.classList.add("off");
      typing.clear(); renderTyping();
      for (const b of asks.splice(0)) b.lost();
      sends.lost();
      for (const box of $msgs.querySelectorAll(".editor[data-saving]")) {
        delete box.dataset.saving;
        const ed = box.closest(".editbox").ed;
        ed.fail("connection lost: check the message before saving again");
        ed.elsewhere(hist.records.get(box.closest(".msg").dataset.id));  // skipped while it saved
      }
      setTimeout(connect, retry.next());
    };
  };
  // ⚙: the settings this page reads, on the widget's keys: a tab opened in another browser through
  // --browser has a storage of its own, set here. A choice drops its URL parameter: the URL outranks storage.
  const $cog = document.getElementById("cog"), $gear = document.getElementById("gear");
  let cogOpen = false;
  const here = () => location.pathname + (q.size ? "?" + q : "");
  const choose = (k, v) => { keep(k, v); q.delete(k); history.replaceState(history.state, "", here()); };
  const segOf = (title, items, cur, pick) => {
    const box = el("div"), seg = el("div", "seg");
    for (const [k, label] of items) {
      const b = el("button", cur === k ? "on" : null, label);
      b.setAttribute("aria-pressed", String(cur === k));
      b.onclick = () => {
        for (const o of seg.children) { o.classList.toggle("on", o === b); o.setAttribute("aria-pressed", String(o === b)); }
        pick(k);
      };
      seg.append(b);
    }
    box.append(el("h3", null, title), seg);
    return box;
  };
  const renderCog = () => {
    $cog.classList.toggle("open", cogOpen);
    $gear.setAttribute("aria-expanded", String(cogOpen));
    $cog.querySelector(".menu")?.remove();
    if (!cogOpen) return;
    const menu = el("div", "menu");
    menu.id = "settings";
    menu.setAttribute("role", "group"); menu.setAttribute("aria-label", "settings");
    menu.onclick = (e) => e.stopPropagation();
    const theme = ["light", "dark"].includes(pref("theme")) ? pref("theme") : "auto";
    const themes = segOf("Theme", [["auto", "◐ Auto"], ["light", "☀ Light"], ["dark", "☾ Dark"]], theme,
      (k) => { choose("theme", k); applyPrefs(); });
    const dbox = el("div"), lab = el("label", null, "Show avatars"), sw = el("input", "switch");
    sw.type = "checkbox"; sw.checked = pref("avatars") !== "0";
    sw.onchange = () => { choose("avatars", sw.checked ? "1" : "0"); applyPrefs(); renderRows(); };
    lab.append(sw); dbox.append(el("h3", null, "Display"), lab);
    const tbox = el("div"), rlab = el("label", null, "Mark read in Teams when shown"), rsw = el("input", "switch");
    rsw.type = "checkbox"; rsw.checked = autoOn();
    rsw.onchange = () => { choose("autoread", rsw.checked ? "1" : "0"); autoRead(); };
    rlab.append(rsw); tbox.append(el("h3", null, "Teams"), rlab);
    const nav = segOf("Chat navigation", [["list", "List"], ["split", "Split"]], split ? "split" : "list", (k) => {
      keep("chatnav", k); q.delete("chatnav");
      saveDraft();
      location.replace(here());
    });
    // Reactions (spec 016): a slot click replaces it through the emoji search, the arrows move the slot chosen.
    const rbox = el("div"), slots = el("div", "favs"), tools = el("div", "favtools");
    const left = el("button", null, "◀"), right = el("button", null, "▶"), reset = el("button", null, "Reset");
    let chosen = -1;
    const drawFavs = () => {
      const list = favs();
      slots.replaceChildren(...list.map((f, i) => {
        const b = el("button", i === chosen ? "on" : null);
        b.append(favFace(f));
        b.title = `${favName(f)}: replace`; b.setAttribute("aria-label", `slot ${i + 1}, ${b.title}`);
        b.setAttribute("aria-pressed", String(i === chosen));
        b.onclick = () => {
          chosen = i; drawFavs();
          const back = () => slots.children[i]?.focus();
          openSearch(rbox, (g) => { const l = [...favs()]; l[i] = g; save(l); back(); }, back);
        };
        return b;
      }));
      left.disabled = chosen <= 0; right.disabled = chosen < 0 || chosen >= list.length - 1;
    };
    const save = (list) => { keep("reactions", JSON.stringify(list)); drawFavs(); };
    const move = (d) => { const l = [...favs()]; [l[chosen], l[chosen + d]] = [l[chosen + d], l[chosen]]; chosen += d; save(l); };
    left.title = "move the chosen slot left"; right.title = "move the chosen slot right"; reset.title = "back to the default reactions";
    for (const b of [left, right, reset]) b.setAttribute("aria-label", b.title);
    left.onclick = () => move(-1); right.onclick = () => move(1);
    reset.onclick = () => { keep("reactions", null); chosen = -1; drawFavs(); };
    tools.append(left, right, reset);
    rbox.append(el("h3", null, "Reactions"), slots, tools);
    drawFavs();
    menu.append(themes, dbox, tbox, nav, rbox);
    $cog.append(menu);
  };
  const closeCog = (focus) => { cogOpen = false; renderCog(); if (focus) $gear.focus(); };
  $gear.onclick = (e) => {
    e.stopPropagation();
    cogOpen = !cogOpen;
    renderCog();
    if (cogOpen) $cog.querySelector(".menu .on").focus();
  };
  $cog.onkeydown = (e) => { if (e.key === "Escape" && cogOpen) { e.stopPropagation(); closeCog(true); } };
  $cog.addEventListener("focusout", () => setTimeout(() => { if (cogOpen && !$cog.contains(document.activeElement)) closeCog(false); }));
  applyPrefs();
  if (!thread) {
    $note.className = "err"; $note.textContent = "malformed chat address";
    $reply.disabled = true;
    return;
  }
  unstash();
  sends.load(split ? null : [thread]);  // other chats' queues stay stored, for the widget that queued them
  if (split) startSplit();
  signIn.then(connect);
  $reply.focus();
})();
</script>
</body>
</html>
