<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniteams</title>
<link rel="icon" href="/favicon.svg">
<style>
  /* ui.css */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  header { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  header > .seg { margin-right: auto; flex-shrink: 0; }  /* the filter absorbs the squeeze, not the tabs */
  header > #mode { margin-right: 0; }
  .seg button { border: 0; background: transparent; padding: 4px 8px; white-space: nowrap; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 12.5px; }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 550; }
  .seg b { font-weight: 600; margin-left: 3px; font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .seg button.mention b { background: var(--mention-soft); color: var(--mention); }
  #q { flex: 0 1 132px; min-width: 56px; margin: 0 auto; font: inherit; font-size: 12.5px; color: inherit; background: var(--panel-2);
    border: 0; border-radius: 10px; padding: 4px 8px; }
  #q::placeholder { color: var(--faint); }
  #q:focus { outline: 2px solid var(--accent-soft); }
  /* Narrow widget window: title, filter, dot and ⚙ on one line, the tabs on a full-width second one. */
  @media (max-width: 640px) {
    header { flex-wrap: wrap; gap: 6px 8px; padding: 8px 10px; }
    header > .seg { order: 1; flex-basis: 100%; }
    #q { flex-basis: 200px; }  /* its auto margins centre it: h1 keeps none, or it drifts right */
  }
  .name mark { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 2px; }
  li.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Arrowing up scrolls the row to the viewport top, which the sticky header covers. */
  li { scroll-margin-top: var(--hdr, 90px); }
  #status { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); flex: none; }
  #status.off { background: var(--hot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 25%, transparent); }

  ul { list-style: none; margin: 8px; padding: 0; display: grid; gap: 2px; }
  li { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 2px 10px; padding: 9px 10px; border-radius: 12px; align-items: center; position: relative; }
  li:hover { background: var(--panel); box-shadow: var(--shadow); }
  li.unread { box-shadow: inset 3px 0 0 var(--stripe); }
  li.unread:hover { box-shadow: inset 3px 0 0 var(--stripe), var(--shadow); }
  li.mention, li.mention:hover { background: var(--mention-soft); box-shadow: inset 3px 0 0 var(--mention); }
  li.mention.all, li.mention.all:hover { background: color-mix(in srgb, var(--mention-soft) 50%, transparent); box-shadow: inset 3px 0 0 color-mix(in srgb, var(--mention) 45%, transparent); }
  li.seen { opacity: .5; }
  li.seen:has(> .rowmenu) { opacity: 1; }  /* the menu would fade with its row */
  .av { grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 650; font-size: 14px; color: #fff; position: relative; }
  .av.round { border-radius: 50%; }
  .av small { position: absolute; right: -4px; bottom: -4px; font-size: 11px; background: var(--bg); border-radius: 6px; padding: 0 2px; line-height: 16px; }
  .name { font-weight: 500; color: inherit; text-decoration: none; }
  .name:hover { text-decoration: underline; }
  li.unread .name, li.mention .name { font-weight: 700; }
  li.mention.all .name { font-weight: 600; }
  .meta { grid-column: 3; grid-row: 1; justify-self: end; display: flex; align-items: center; gap: 6px; }
  .when { font-size: 12px; color: var(--faint); white-space: nowrap; }
  li.unread .when { color: var(--accent); font-weight: 600; }
  .meta button { display: none; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; height: 20px; padding: 0 6px; font-size: 12px; line-height: 18px; cursor: pointer; color: var(--dim); }
  li:hover .meta button, li:focus-within .meta button, li.hold .meta button, li:has(> .rowmenu) .meta button { display: inline-block; }
  .meta button:hover { color: var(--ok); border-color: var(--ok); }
  .meta button.read:hover, .meta button.reply:hover { color: var(--accent); border-color: var(--accent); }
  .prev { grid-column: 2; grid-row: 2; color: var(--dim); font-size: 13px; }
  .prev b { color: var(--text); font-weight: 550; }
  li.unread .prev, li.mention .prev { color: var(--text); }
  .prev .at { color: var(--mention); font-weight: 650; background: var(--mention-soft); border-radius: 4px; padding: 0 3px; }
  .typing { color: var(--typing); font-style: italic; }
  .ind { grid-column: 3; grid-row: 2; justify-self: end; display: flex; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .tag { font-size: 11px; font-weight: 700; color: var(--on-mention); background: var(--mention); border-radius: 99px; padding: 0 7px; line-height: 18px; white-space: nowrap; }
  .tag i { font-style: normal; font-weight: 500; opacity: .85; }
  .tag.all { background: transparent; color: var(--mention); box-shadow: inset 0 0 0 1px var(--mention); }
  /* Compact (avatars off): tighter rows, a hairline between them instead of the avatar rhythm. */
  body.compact ul { gap: 0; margin: 4px 8px; }
  body.compact li { grid-template-columns: minmax(0,1fr) auto; padding: 5px 10px; gap: 0 10px; border-radius: 8px; }
  body.compact li + li::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; border-top: 1px solid var(--line); }
  body.compact li:hover::before, body.compact li:hover + li::before, body.compact li.mention::before, body.compact li.mention + li::before { border-color: transparent; }
  body.compact .name { grid-column: 1; grid-row: 1; }
  body.compact .meta, body.compact .ind { grid-column: 2; }
  body.compact .prev { grid-column: 1; font-size: 12.5px; }
  li.composer { display: block; padding: 0 10px 8px 60px; }
  li.composer:hover { background: none; box-shadow: none; }
  body.compact li.composer { padding-left: 10px; }
  body.compact li.composer::before, body.compact li.composer + li::before { border-color: transparent; }
  #reply { display: block; width: 100%; resize: none; max-height: calc(6lh + 14px); overflow-y: auto; font: inherit; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
  #reply:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #reply:disabled { opacity: .6; }
  .composer small { display: block; color: var(--hot); font-size: 12px; margin-top: 2px; }
  li.composer .imgs { --thumb: 32px; margin: 4px 0 0; gap: 8px; }
  #reply { padding-right: 30px; }
  .composer .clip { position: absolute; top: 3px; right: 14px; border: 0; background: none; padding: 2px 4px; cursor: pointer; color: inherit; }
  /* The open reply's send queue (spec 017): a truncated line per message. Contained: a long line must
     not widen the list's grid column. */
  .qlines { contain: inline-size; }
  .qlines .q { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; margin-top: 2px; }
  .qlines .qtext { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A long reason (its whole text in the title) must leave the message room. */
  .qlines .qstate { max-width: 35%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qlines textarea { flex: 1; }
  #empty { padding: 2em; text-align: center; color: var(--dim); }
  /* Still filling in from the live listing: the rows on screen come from the local archive. */
  .spin { position: fixed; right: 14px; bottom: 14px; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
    background: var(--bg); box-shadow: var(--shadow); z-index: 3; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--accent); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>miniteams</h1>
  <div class="seg" id="tabs"></div>
  <input id="q" type="search" placeholder="filter" autocomplete="off" spellcheck="false" aria-label="filter chats by name">
  <div class="seg" id="mode" role="group" aria-label="arrange chats" hidden></div>
  <span id="status" title="connecting…"></span>
  <div class="cog" id="cog"><button id="gear" title="options">⚙</button></div>
</header>
<ul id="rows"></ul>
<span id="say" class="sr" aria-live="polite"></span>
<div id="empty" hidden>nothing yet</div>
<div id="spin" class="spin" hidden title="loading the live list…"></div>
<script>
(() => {
  // ui.js defines store keep q pref el hue initials wsUrl signIn dial backoff isSeen mentioned kind rowTitle ago foldText filters named marked mentionLine preview likeTitle focusIn itemKey itemOf rowActions sectionList caret firstLine completion insertText formatBar imageQueue sendQueue
  /* ui.js */
  const $rows = document.getElementById("rows"), $empty = document.getElementById("empty"),
        $status = document.getElementById("status"), $tabs = document.getElementById("tabs"),
        $cog = document.getElementById("cog"), $gear = document.getElementById("gear"),
        $q = document.getElementById("q"), $say = document.getElementById("say"),
        $spin = document.getElementById("spin"), $mode = document.getElementById("mode"),
        $header = document.querySelector("header");
  let rows = [], ws = null, pageVersion = null, opener = false, browser = false, meName = "", menuOpen = false, query = "", sel = "";
  const CLOCK_TICK_MS = 30000;  // relative row times
  const TABS = { all: "Inbox", mention: "@", unread: "Unread", seen: "Seen", muted: "Muted" }, THEMES = ["auto", "light", "dark"];
  let tab = TABS[pref("tab")] ? pref("tab") : "all";
  let theme = THEMES.includes(pref("theme")) ? pref("theme") : "auto";
  let avatars = pref("avatars") !== "0";
  let midclick = pref("midclick") === "chat" ? "chat" : "teams";
  let chatnav = pref("chatnav") === "split" ? "split" : "list";
  // The setting travels in the URL: the chat page may open in a browser without our storage (--browser).
  const chatPage = (id) => "/chat/" + encodeURIComponent(id) + (chatnav === "split" ? "?chatnav=split" : "");
  // The chat page's ◀ lands here: rows open our chat page instead of Teams.
  const nav = q.get("nav") === "chat";
  // Quick reply: one composer element; drafts live per chat, and survive a reload (a newer widget.html, F5).
  let replyTo = "";
  const drafts = new Map(), errors = new Map(), DRAFT = "reply:";

  const glyph = { group: "👥", meeting: "📅" };
  const send = (obj) => { if (!(ws && ws.readyState === 1)) return false; ws.send(JSON.stringify(obj)); return true; };
  const pick = () => rows.filter((r) => filters[tab](r) && named(r, query));
  const counts = () => Object.fromEntries(
    Object.entries(filters).map(([k, f]) => [k, rows.filter((r) => f(r) && named(r, query)).length]));
  // The native window (spec 024) injects a promise of its tray before this script; a browser has none.
  // live: a seeded board frame since the socket last closed; the seeding ones (`busy`) count nothing yet.
  let tray = null, live = false, busy = false;
  const BADGES = [["unread", "Unread"], ["mention", "@"], ["all", "Inbox"], ["none", "None"]];
  let badge = BADGES.some(([k]) => k === pref("badge")) ? pref("badge") : "unread";
  // A tab's rule without the filter box: the badge counts what the tab shows once the box is empty.
  // Disconnected: no count, whatever the choice; a stale one would read as live.
  const publish = () => tray?.badge(...(live && badge !== "none" ? [badge, rows.filter(filters[badge]).length] : ["none", 0]));
  // Desktop notifications: what changed between two live frames, so never the snapshot of a (re)connection.
  const ALERTS = [["mention", "@"], ["all", "Messages"], ["none", "None"]], YOU = "You";  // web.py's _YOU
  let alert = ALERTS.some(([k]) => k === pref("notify")) ? pref("notify") : "mention";
  let before = null;  // id → row of the previous live frame
  const heard = new Set();  // "chat message" keys notified: one message, one notification
  const clip = (t, n) => t.length > n ? t.slice(0, n - 1) + "…" : t;
  const news = () => {
    const prev = before;
    before = live ? new Map(rows.map((r) => [r.id, r])) : null;
    if (!prev || !before || !tray || alert === "none") return;
    for (const r of rows) {
      const old = prev.get(r.id), m = r.mention;
      // A mention surfaces even in a muted chat, as on the @ tab; other messages follow the Inbox's rule.
      const [id, by, text] = m?.msg_id && m.msg_id !== old?.mention?.msg_id && m.by !== YOU ? [m.msg_id, m.by, m.text]
        : alert === "all" && r.last_id && r.last_id !== old?.last_id && r.sender && r.sender !== YOU && !r.muted && !isSeen(r)
          ? [r.last_id, r.sender, r.text] : [];
      if (!id || heard.has(r.id + " " + id)) continue;
      heard.add(r.id + " " + id);
      if (heard.size > 500) heard.delete(heard.values().next().value);  // the page runs for days
      const chat = rowTitle(r);
      tray.notify(r.id, clip(by && by !== chat ? by + " · " + chat : chat, 120), clip(text || "", 200));
    }
  };

  const renderHeader = () => {
    const c = counts();
    $tabs.replaceChildren(...Object.entries(TABS).map(([k, lbl]) => {
      const b = el("button", (tab === k ? "on " : "") + (k === "mention" ? "mention" : ""), lbl);
      b.append(el("b", null, c[k])); b.onclick = () => { tab = k; keep("tab", k); render(); }; return b;
    }));
    secs.paint($mode);
    document.documentElement.style.setProperty("--hdr", $header.offsetHeight + "px");
    $cog.classList.toggle("open", menuOpen);
    $cog.querySelector(".menu")?.remove();
    if (!menuOpen) return;
    const menu = el("div", "menu"); menu.onclick = (e) => e.stopPropagation();
    const tbox = el("div"), tseg = el("div", "seg");
    for (const [k, lbl] of [["auto", "◐ Auto"], ["light", "☀ Light"], ["dark", "☾ Dark"]]) {
      const b = el("button", theme === k ? "on" : "", lbl); b.onclick = () => { theme = k; keep("theme", k); render(); }; tseg.append(b);
    }
    tbox.append(el("h3", null, "Theme"), tseg);
    const dbox = el("div"), lab = el("label", null, "Show avatars"), sw = el("input", "switch");
    sw.type = "checkbox"; sw.checked = avatars; sw.onchange = () => { avatars = sw.checked; keep("avatars", avatars ? "1" : "0"); render(); };
    lab.append(sw); dbox.append(el("h3", null, "Display"), lab);
    const mbox = el("div"), mseg = el("div", "seg");
    for (const [k, lbl] of [["teams", "Teams web"], ["chat", "Chat here"]]) {
      const b = el("button", midclick === k ? "on" : "", lbl); b.onclick = () => { midclick = k; keep("midclick", k); render(); }; mseg.append(b);
    }
    mbox.append(el("h3", null, "Middle click"), mseg);
    const nbox = el("div"), nseg = el("div", "seg");
    for (const [k, lbl] of [["list", "List"], ["split", "Split"]]) {
      const b = el("button", chatnav === k ? "on" : "", lbl); b.onclick = () => { chatnav = k; keep("chatnav", k); render(); }; nseg.append(b);
    }
    nbox.append(el("h3", null, "Chat navigation"), nseg);
    menu.append(tbox, dbox, mbox, nbox);
    if (tray) {
      const ybox = el("div"), yseg = el("div", "seg");
      ybox.id = "tray";
      for (const [k, lbl] of BADGES) {
        const b = el("button", badge === k ? "on" : "", lbl); b.onclick = () => { badge = k; keep("badge", k); publish(); render(); }; yseg.append(b);
      }
      const abox = el("div"), aseg = el("div", "seg");
      abox.id = "notify";
      for (const [k, lbl] of ALERTS) {
        const b = el("button", alert === k ? "on" : "", lbl); b.onclick = () => { alert = k; keep("notify", k); render(); }; aseg.append(b);
      }
      ybox.append(el("h3", null, "Tray"), yseg); abox.append(el("h3", null, "Notify"), aseg); menu.append(ybox, abox);
    }
    $cog.append(menu);
  };

  // A plain click on a row; null leaves it to its link (the Teams link, in a new tab).
  const opens = (r) => nav ? () => location.assign(chatPage(r.id))
    : opener && r.last_id ? () => send({ open: r.id, web: false }) : null;
  const render = () => {
    if (actions.held()) return;
    if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    document.body.classList.toggle("compact", !avatars);
    rows.sort((a, b) => (a.last_activity < b.last_activity) - (a.last_activity > b.last_activity));
    renderHeader();
    // Rebuilt on every broadcast: the keyboard focus moves to the same control of the new row.
    const f = document.activeElement, fk = $rows.contains(f) ? f.dataset.k : undefined, fid = fk && itemKey(f.closest("li"));
    const shown = pick();
    const items = secs.items({ shown, query, actions, sel, row: (r) => {
      const m = mentioned(r), k = kind(r.id);
      const li = el("li", (r.unread ? "unread " : "") + ((isSeen(r) || r.muted) && !m ? "seen " : "") + (r.id === sel ? "sel " : "") + (m ? "mention " + r.mention.kind : ""));
      li.dataset.id = r.id;
      li.style.setProperty("--stripe", `hsl(${hue(r.id)} 62% 55%)`);
      if (avatars) {
        const av = el("div", "av" + (k === "dm" ? " round" : ""), initials(rowTitle(r)));
        av.style.background = `linear-gradient(135deg, hsl(${hue(r.id)} 62% 58%), hsl(${(hue(r.id) + 40) % 360} 62% 48%))`;
        if (glyph[k]) av.append(el("small", null, glyph[k]));
        if (r.peer) { av.dataset.pmri = r.peer; presenceDot(av); }
        li.append(av);
      }
      const name = Object.assign(marked(el("a", "name truncate"), rowTitle(r), query), { href: r.link || "#", target: "_blank", rel: "noopener", title: r.label, dir: "auto" });
      name.dataset.k = "name";  // a broadcast keeps the focus on it
      // Plain click → the server opens the chat (desktop client); Shift click → the https link, through
      // the server's --browser when set, else in this browser; middle click → `middle`.
      const chatHere = nav || midclick === "chat";
      // Without --browser, the Teams link's native new tab (middle or Ctrl click alike) does the work.
      const middle = (ev) => {
        if (chatHere) {
          ev.preventDefault();
          if (browser) send({ open: r.id, chat: true, ...(chatnav === "split" && { chatnav }) });
          else window.open(chatPage(r.id), "_blank", "noopener");
        } else if (browser) { ev.preventDefault(); send({ open: r.id, web: true }); }
      };
      // Without a message id the only link form is chat-only, which the desktop client cannot
      // route in page (it reloads, dropping a call): let that one open in the browser instead.
      name.onclick = (ev) => {
        if (ev.detail > 0) name.blur();  // a pointer's focus would pin the row's ✎ 👁 ⋯ through the next broadcast
        if (ev.button === 1) { if (chatHere || browser) ev.preventDefault(); return; }  // onauxclick owns it: no Teams tab from the link too
        // Ctrl/⌘ click = middle click: a touchpad has no easy middle button.
        if (ev.ctrlKey || ev.metaKey) { middle(ev); return; }
        if (ev.shiftKey) { if (browser) { ev.preventDefault(); send({ open: r.id, web: true }); } return; }
        const go = opens(r);
        if (go) { ev.preventDefault(); go(); }
      };
      name.onauxclick = (ev) => { if (ev.button === 1) middle(ev); };
      const replyBtn = el("button", "reply", "✎"); replyBtn.title = "reply (r)"; replyBtn.dataset.k = "reply";
      replyBtn.onclick = () => openReply(r.id);
      const meta = el("span", "meta"), [acts, menu] = actions(r);
      meta.append(replyBtn, ...acts, Object.assign(el("span", "when", ago(r.last_activity)), { title: r.last_activity }));
      const ind = el("span", "ind");
      if (m) {
        const tag = el("span", "tag " + r.mention.kind, r.mention.kind === "all" ? "@ all" : "@ you");
        if (r.mention.edited) tag.append(el("i", null, " · edited " + ago(r.mention.at)));
        tag.title = r.mention.at; ind.append(tag);
      } else if (r.unread) ind.append(el("span", "dot"));
      const prev = likeTitle(preview(r, el("span", "prev truncate"), meName), name);
      // Only a line the row width cut gets the whole text on hover; width is known at hover time.
      prev.onmouseenter = () => { prev.title = prev.scrollWidth > prev.clientWidth ? prev.textContent : ""; };
      li.append(name, meta, prev, ind, ...menu);
      return li;
    } });
    // The rows move around the composer, never the composer: detaching it would drop its focus
    // and abort an IME composition in progress.
    const at = items.findIndex((li) => li.dataset.id === replyTo);
    for (const n of [...$rows.children]) if (n !== $composer) n.remove();
    if (at < 0) { $composer.remove(); $rows.append(...items); }
    else { if (!$composer.isConnected) $rows.append($composer); $composer.before(...items.slice(0, at + 1)); $composer.after(...items.slice(at + 1)); }
    imgs.render();
    sends.draw($lines, replyTo, sends.list(replyTo));
    $err.textContent = errors.get(replyTo) || "";
    // A focused chat filed into a folded section: its header took the selection, it takes the focus.
    const fli = fk && itemOf($rows, fid);
    if (fli) focusIn(fli, fk);
    else if (fk && sel[0] === "§") focusIn(itemOf($rows, sel), "head");
    $empty.textContent = query ? "no chat matches" : "nothing yet";
    $empty.hidden = items.length > 0;
  };

  const secs = sectionList({ view: "widget", list: $rows, send, render: () => render(), select: (k) => { sel = k; }, filter: $q });
  const actions = rowActions($rows, () => render(), send, secs);
  const $composer = el("li", "composer"), $reply = el("textarea"), $err = el("small"), $pop = el("div"), $imgs = el("div", "imgs"), $lines = el("div", "qlines");
  const $clip = Object.assign(el("button", "clip", "📎"), { id: "clip", title: "attach files" });
  $clip.setAttribute("aria-label", "attach files");
  $reply.id = "reply"; $reply.rows = 1; $reply.placeholder = "reply · Enter sends, Shift+Enter new line";
  $reply.setAttribute("aria-label", "reply");
  $pop.id = "pop"; $pop.hidden = true;
  $composer.append($reply, $pop, $imgs, $err, $lines, $clip);  // last: Tab from the box reaches a failed line's actions first
  const grow = () => { $reply.style.height = "auto"; $reply.style.height = $reply.scrollHeight + 2 + "px"; };
  const edited = () => { drafts.set(replyTo, $reply.value); grow(); };

  const complete = completion({
    input: $reply, pop: $pop, send: (o) => send(o), chat: () => replyTo, edited: () => edited(), above: false,
    put: (text, from, to) => $reply.setRangeText(text, from, to, "end"),
  });
  const imgs = imageQueue({
    input: $reply, box: $imgs, chat: () => replyTo, busy: (id) => sends.busy(id), clip: $clip, zone: $composer,
    error: (id, text, was) => {
      if (was !== undefined && errors.get(id) !== was) return;  // another error replaced our refusal since
      if (text) errors.set(id, text); else errors.delete(id);
      render();
    },
  });
  const sends = sendQueue({
    imgs, socket: () => ws, changed: () => render(),
    nothing: (id) => { if (!errors.has(id)) errors.set(id, "nothing to send"); },  // a refused image keeps its own reason
    note: (id, text) => errors.set(id, text),
    edit: (id, e) => {
      if (id !== replyTo || $reply.value || imgs.list(id).length || imgs.adding()) return false;
      $reply.value = e.verb.text; drafts.set(id, e.verb.text); grow(); complete.restore(e.verb.mentions, id, e.verb.text); $reply.focus();
      return true;
    },
  });
  const UNSURE = "no answer from Teams: it may have gone out · ↻ checks the chat before sending again";

  let left = false;
  const saveDraft = () => {
    if (left) return;  // once: the version reload saves, then its pagehide would again
    left = true;
    sends.save();
    for (const [id, text] of drafts) {
      const record = { text, picked: complete.mentions(text, id), sent: imgs.again(id) };
      try { if (text) sessionStorage.setItem(DRAFT + id, JSON.stringify(record)); } catch (e) {}
    }
  };
  addEventListener("pagehide", (e) => { if (!e.persisted) saveDraft(); });
  // Data from sessionStorage, checked like any input.
  try {
    for (const k of Object.keys(sessionStorage)) {
      if (!k.startsWith(DRAFT)) continue;
      const id = k.slice(DRAFT.length), d = JSON.parse(sessionStorage.getItem(k));
      sessionStorage.removeItem(k);
      if (typeof d?.text !== "string") continue;
      drafts.set(id, d.text);
      if (Array.isArray(d.picked)) complete.restore(d.picked, id, d.text);
      imgs.arm(id, d.sent);  // a failed message taken back with ✎: sent unchanged, it is a retry
    }
  } catch (e) {}
  sends.load();
  const openReply = (id) => {
    replyTo = sel = id;
    $reply.value = drafts.get(id) || "";
    complete.reset();
    render();
    if (!$composer.isConnected) return;
    grow();
    $reply.focus();
    $reply.setSelectionRange($reply.value.length, $reply.value.length);
  };
  const closeReply = () => { replyTo = ""; complete.close(); render(); $q.focus(); };
  // Enter empties the box at once and the reply stays open; the chat's messages go out one at a time. A
  // failure stays in the queue, its line's ↻ ✎ ✕ decide; a message sent meanwhile waits behind it.
  const submit = () => {
    const id = replyTo, text = $reply.value, held = sends.held(id);
    const empty = !text.trim() && !imgs.list(id).length && !imgs.adding();
    if (empty && !held) return;
    if (!(ws && ws.readyState === 1)) { errors.set(id, "offline, not sent"); render(); return; }
    if (!empty) {
      sends.push(id, { verb: { send: id, text, mentions: complete.mentions(text), format: "inline" } }, held);  // a failed message edited in the box goes back to its place
      $reply.value = ""; drafts.delete(id); grow(); complete.forget(id);
    }
    errors.delete(id);
    sends.resume(id);
  };
  $reply.oninput = edited;
  // Teams' keys: Enter sends, Shift+Enter breaks the line (Ctrl+Enter sends too).
  $reply.onkeydown = (e) => {
    if (complete.key(e)) { e.preventDefault(); return; }
    if (e.key === "Escape") { e.preventDefault(); closeReply(); return; }
    if (e.key !== "Enter" || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    submit();
  };

  $q.oninput = () => { query = foldText($q.value.trim())[0]; sel = ""; render(); };
  // Arrow keys walk the list, section headers included, without leaving the filter box; Enter opens the
  // selection exactly as a plain click does — through the server, which hands the chat to the desktop client.
  const reveal = () => { const li = $rows.querySelector("li.sel"); li?.scrollIntoView({ block: "nearest" }); $say.textContent = li?.querySelector(".name, .sname")?.textContent || ""; };
  const move = (delta) => {
    const list = [...$rows.children].map(itemKey).filter(Boolean);
    if (!list.length) return;
    const i = list.indexOf(sel);
    sel = list[i < 0 ? (delta > 0 ? 0 : list.length - 1) : Math.max(0, Math.min(list.length - 1, i + delta))];
    render();
    reveal();
  };
  $q.onkeydown = (e) => {
    const d = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0, cur = $rows.querySelector("li.sel"), to = !$q.value && secs.side(cur, e);
    if (d && e.altKey && secs.nudge(sel, d)) e.preventDefault();
    else if (d) { e.preventDefault(); move(d); }
    // ←/→ fold a header or reach a chat's header only in an empty box: else they move the caret.
    else if (to) { e.preventDefault(); sel = itemKey(to); render(); reveal(); }
    else if (e.key === "Enter" && cur?.dataset.sid !== undefined) cur.querySelector(".shead").click();
    // No selection yet: Enter takes the top hit, the way a search box is expected to behave.
    else if (e.key === "Enter") { ($rows.querySelector("li.sel .name") || (query ? $rows.querySelector("li .name") : null))?.click(); }
    // Tab, not `r`: the filter must still take the letter.
    else if (e.key === "Tab" && !e.shiftKey && sel && pick().some((r) => r.id === sel)) { e.preventDefault(); openReply(sel); }
    else if (e.key === "Escape" && (query || sel)) { $q.value = ""; query = ""; sel = ""; render(); }
  };
  $gear.onclick = (e) => { e.stopPropagation(); menuOpen = !menuOpen; renderHeader(); };
  addEventListener("click", () => { if (menuOpen) { menuOpen = false; renderHeader(); } });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && menuOpen) { menuOpen = false; renderHeader(); } });
  addEventListener("keydown", (e) => {
    if (e.key !== "r" || e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.("input, textarea")) return;
    if (sel && pick().some((r) => r.id === sel)) { e.preventDefault(); openReply(sel); }
  });

  const retry = backoff();
  const connect = () => {
    ws = dial("/ws");
    ws.onopen = () => { retry.reset(); $status.title = "live"; $status.classList.remove("off"); };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      // A newer widget.html on the server (restart, edit): this page is stale, reload it.
      // Sends resume only past this check: a page about to reload must not resend first.
      if (msg.page) { if (pageVersion && msg.page !== pageVersion) { saveDraft(); location.reload(); return; } pageVersion = msg.page; sends.wake(); }
      if ("opener" in msg) opener = !!msg.opener;
      if ("browser" in msg) browser = !!msg.browser;
      if ("me" in msg) meName = msg.me || "";
      if ("busy" in msg) { busy = !!msg.busy; $spin.hidden = !busy; }
      if (msg.rows) { rows = msg.rows; live = !busy; secs.set(msg.sections); render(); publish(); news(); }
      if (msg.presence) paintPresence(msg.presence);
      if (msg.complete) complete.answered(msg);
      if (msg.sent) { if (msg.ok) sends.done(msg.sent); else sends.fail(msg.sent, msg.unsure ? UNSURE : msg.error || "not sent"); }
    };
    ws.onclose = () => {
      $status.title = "disconnected"; $status.classList.add("off");
      live = false; before = null; publish();
      sends.lost();
      setTimeout(connect, retry.next());  // server restarts → page recovers alone
    };
  };
  render();
  window.miniteamsTray?.then((t) => {
    tray = t;
    t.settings.connect(() => { menuOpen = true; renderHeader(); });
    // A notification clicked: the window is shown, the chat opens as a click on its row does.
    t.opened.connect((id) => {
      const r = rows.find((x) => x.id === id), go = r && opens(r);
      if (go) go(); else if (r?.link) window.open(r.link, "_blank", "noopener");
    });
    publish(); renderHeader();
  });
  signIn.then(connect);
  setInterval(render, CLOCK_TICK_MS);
})();
</script>
</body>
</html>
