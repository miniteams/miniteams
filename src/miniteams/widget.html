<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniteams</title>
<style>
  :root { color-scheme: light dark; --dim: #888; --line: #8884; --hot: #2f81f7; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 1em; align-items: center; padding: .5em 1em; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: Canvas; }
  header h1 { font-size: 1em; margin: 0; flex: 1; }
  #status { color: var(--dim); font-size: .85em; }
  header label { color: var(--dim); font-size: .85em; white-space: nowrap; }
  li.hidden { opacity: .45; }
  li.unread .label { font-weight: 700; }
  li.unread .last { color: CanvasText; }
  li button { grid-column: 3; grid-row: 1 / span 2; align-self: center; font: inherit; font-size: .8em; padding: .15em .5em; cursor: pointer; }
  #status.off { color: #d33; }
  ul { list-style: none; margin: 0; padding: 0; }
  /* Every cell is placed explicitly: an auto-placed item next to a row-spanning one lands
     wherever the algorithm likes (the button ended up in column 1, full width). */
  li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-rows: auto auto; gap: .15em .8em; padding: .5em 1em; border-bottom: 1px solid var(--line); }
  li .label { grid-column: 1; grid-row: 1; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .when { grid-column: 2; grid-row: 1; color: var(--dim); font-size: .85em; white-space: nowrap; }
  li .last { grid-column: 1 / span 2; grid-row: 2; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .last b { color: CanvasText; font-weight: 500; }
  li .typing { color: var(--hot); }
  #empty { padding: 2em; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<header><h1>miniteams</h1><label><input type="checkbox" id="unreadonly"> unread only (<span id="nunread">0</span>)</label><label><input type="checkbox" id="showhidden"> show seen (<span id="nhidden">0</span>)</label><span id="status">connecting…</span></header>
<ul id="rows"></ul>
<div id="empty" hidden>nothing yet</div>
<script>
(() => {
  const $rows = document.getElementById("rows"), $empty = document.getElementById("empty"),
        $status = document.getElementById("status"), $show = document.getElementById("showhidden"),
        $nhidden = document.getElementById("nhidden"), $unread = document.getElementById("unreadonly"),
        $nunread = document.getElementById("nunread");
  let rows = [], ws = null, pageVersion = null;
  try { $show.checked = localStorage.getItem("showhidden") === "1"; } catch (e) {}
  $show.onchange = () => { try { localStorage.setItem("showhidden", $show.checked ? "1" : "0"); } catch (e) {} render(); };
  try { $unread.checked = localStorage.getItem("unreadonly") === "1"; } catch (e) {}
  $unread.onchange = () => { try { localStorage.setItem("unreadonly", $unread.checked ? "1" : "0"); } catch (e) {} render(); };
  const isSeen = (r) => !!r.seen_at && r.seen_at >= r.last_activity;

  const ago = (iso) => {
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (isNaN(s)) return "";
    if (s < 60) return "now";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h";
    return Math.floor(s / 86400) + "d";
  };

  const render = () => {
    const sorted = [...rows].sort((a, b) => (a.last_activity < b.last_activity) - (a.last_activity > b.last_activity));
    $nhidden.textContent = sorted.filter(isSeen).length;
    $nunread.textContent = sorted.filter((r) => r.unread).length;
    let shown = $show.checked ? sorted : sorted.filter((r) => !isSeen(r));
    if ($unread.checked) shown = shown.filter((r) => r.unread);
    $rows.replaceChildren(...shown.map((r) => {
      const li = document.createElement("li");
      li.dataset.id = r.id;
      if (isSeen(r)) li.classList.add("hidden");
      if (r.unread) li.classList.add("unread");
      const label = Object.assign(document.createElement("span"), { className: "label", textContent: r.label });
      const when = Object.assign(document.createElement("span"), { className: "when", textContent: ago(r.last_activity), title: r.last_activity });
      const last = document.createElement("span"); last.className = "last";
      if (r.typing && r.typing.length) {
        last.classList.add("typing"); last.textContent = "✍ " + r.typing.join(", ");
      } else {
        const who = Object.assign(document.createElement("b"), { textContent: r.sender ? r.sender + ": " : "" });
        last.append(who, r.text || "");
      }
      const seen = Object.assign(document.createElement("button"), { textContent: "seen", disabled: isSeen(r) });
      // Send what was on screen: a message landing between render and click must stay visible.
      seen.onclick = () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ seen: r.id, at: r.last_activity }));
      li.append(label, when, seen, last);
      return li;
    }));
    $empty.hidden = shown.length > 0;
  };

  let retry = 1000;
  const connect = () => {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => { retry = 1000; $status.textContent = "live"; $status.classList.remove("off"); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      // A newer widget.html on the server (restart, edit): this page is stale, reload it.
      if (m.page) { if (pageVersion && m.page !== pageVersion) { location.reload(); return; } pageVersion = m.page; }
      if (m.rows) { rows = m.rows; render(); }
    };
    ws.onclose = () => {
      $status.textContent = "disconnected"; $status.classList.add("off");
      setTimeout(connect, retry); retry = Math.min(retry * 2, 30000);  // server restarts → page recovers alone
    };
  };
  connect();
  setInterval(render, 30000);  // keep the relative timestamps honest
})();
</script>
</body>
</html>
